version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install --disable-pip-version-check --no-deps pip==25.0.1 setuptools==84.0.0
      - python -m pip install --disable-pip-version-check --constraint constraints/release-python312.txt --no-build-isolation --requirement docs/requirements.txt
    post_install:
      - python scripts/release_toolchain.py verify-installed --profile docs --require-ci-platform

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
