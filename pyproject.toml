[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DEAPack"
version = "2.0.1"
description = "A comprehensive Python toolkit for DEA-based efficiency and productivity analysis"
readme = "PYPI_README.md"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-only AND CC-BY-4.0 AND MIT"
license-files = [
  "LICENSE",
  "NOTICE",
  "DATA_LICENSES.md",
  "LICENSES/CC-BY-4.0.txt",
  "LICENSES/MIT-DataEnvelopmentAnalysis.jl.txt",
  "LICENSES/MIT-BenchmarkingEconomicEfficiency.jl.txt",
]
authors = [
  { name = "Dr Daoping Wang", email = "daopingwang@outlook.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.15",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.8",
]
benchmark = [
  "psutil>=5.9",
]
test = [
  "jsonschema>=4.23",
  "psutil>=5.9",
  "pytest>=8",
  "pytest-cov>=5",
]
docs = [
  "sphinx>=8",
  "myst-parser>=4",
  "sphinx-intl>=2.3",
  "sphinxcontrib-bibtex>=2.6",
  "pydata-sphinx-theme>=0.16",
  "sphinx-autodoc-typehints>=2.5",
]
dev = [
  "build>=1.2",
  "jsonschema>=4.23",
  "psutil>=5.9",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/daopingw/DEAPack"
Documentation = "https://deapack.readthedocs.io/"
Issues = "https://github.com/daopingw/DEAPack/issues"
Source = "https://github.com/daopingw/DEAPack"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["DEAPack"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
