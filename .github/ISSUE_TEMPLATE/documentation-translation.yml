name: Documentation issue
description: Suggest a clearer explanation, correction, example, figure, or citation fix.
title: "[Editorial]: "
body:
  - type: markdown
    attributes:
      value: |
        Package Documentation contributions use CC-BY-NC-SA-4.0 for original prose and GPL-3.0-only for code. Please identify the affected page and provide enough evidence to review the proposed correction.
  - type: dropdown
    id: kind
    attributes:
      label: Contribution type
      options:
        - Package Documentation
        - Worked case or teaching dataset
        - Figure or visualization
        - Citation or terminology
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page or source location
      description: Link the page or give the repository path and section heading.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain what is unclear or incorrect and propose wording, a figure, a case, or a terminology correction when possible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Terminology or factual evidence
      description: For technical terminology changes, cite an authoritative source and explain why the revision is more accurate.
  - type: textarea
    id: rights
    attributes:
      label: Rights and provenance
      description: If suggesting data, an image, wording from a source, or other third-party material, state its source, transformations, redistribution status, and license. A citation alone is not permission to redistribute.
