name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact canonical PEP 440 version to publish (for example, 2.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'daopingw/DEAPack' &&
      github.ref == format('refs/tags/v{0}', inputs.version)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/release-python312.txt
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned packaging tools
        run: |
          python -m pip install --constraint "$PIP_CONSTRAINT" pip setuptools
          python -m pip install --constraint "$PIP_CONSTRAINT" build packaging twine
          python scripts/release_toolchain.py verify-installed \
            --profile package --require-ci-platform

      - name: Verify the requested version and immutable tag checkout
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import tomllib

          from packaging.version import InvalidVersion, Version

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          raw = metadata["project"]["version"]
          try:
              parsed = Version(raw)
          except InvalidVersion as error:
              raise SystemExit(f"invalid project version: {raw!r}") from error
          if str(parsed) != raw:
              raise SystemExit(f"project version is not canonical PEP 440: {raw!r}")
          if parsed.is_devrelease or parsed.local is not None:
              raise SystemExit("development and local versions cannot be published")

          requested = os.environ["REQUESTED_VERSION"]
          if requested != raw:
              raise SystemExit(
                  f"requested version {requested!r} does not match project version {raw!r}"
              )
          tag = f"v{raw}"
          if os.environ["GITHUB_REF"] != f"refs/tags/{tag}":
              raise SystemExit("run this workflow from the exact release tag")

          head = subprocess.check_output(
              ["git", "rev-parse", "--verify", "HEAD"], text=True
          ).strip()
          tagged = subprocess.check_output(
              ["git", "rev-parse", "--verify", f"{tag}^{{commit}}"], text=True
          ).strip()
          if head != tagged or os.environ["GITHUB_SHA"] != head:
              raise SystemExit("workflow SHA, checkout HEAD, and peeled tag OID differ")
          PY

      - name: Build wheel and source distribution
        run: python -m build --no-isolation

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Smoke-test the installed wheel outside the source tree
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/deapack-wheel-smoke"
          "$RUNNER_TEMP/deapack-wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/deapack-wheel-smoke/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_installed_distribution.py"
          "$RUNNER_TEMP/deapack-wheel-smoke/bin/python" -c \
            'import os, deapack; assert deapack.__version__ == os.environ["EXPECTED_VERSION"]'
          "$RUNNER_TEMP/deapack-wheel-smoke/bin/python" -m pip check

      - name: Validate archives and release declarations from the installed wheel
        run: |
          "$RUNNER_TEMP/deapack-wheel-smoke/bin/python" \
            scripts/validate_distributions.py dist --release

      - name: Upload validated distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deapack-${{ inputs.version }}-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  wheel-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Download the validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deapack-${{ inputs.version }}-distributions
          path: dist

      - name: Smoke-test the same wheel on Python ${{ matrix.python-version }}
        run: |
          python -m venv "$RUNNER_TEMP/deapack-wheel-smoke"
          "$RUNNER_TEMP/deapack-wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/deapack-wheel-smoke/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_installed_distribution.py"
          "$RUNNER_TEMP/deapack-wheel-smoke/bin/python" -c \
            'import os, deapack; assert deapack.__version__ == os.environ["EXPECTED_VERSION"]'
          "$RUNNER_TEMP/deapack-wheel-smoke/bin/python" -m pip check

  publish:
    needs: [build, wheel-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/DEAPack
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deapack-${{ inputs.version }}-distributions
          path: dist

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
