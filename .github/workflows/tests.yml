name: Tests

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  LC_ALL: C
  LANG: C
  MPLBACKEND: Agg
  MPLCONFIGDIR: /tmp/deapack-matplotlib-tests
  MPL_IGNORE_SYSTEM_FONTS: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check Python formatting
        run: ruff format --check src tests benchmarks scripts
      - name: Lint Python
        run: ruff check src tests benchmarks scripts

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest

  minimum-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install declared lower-bound runtime and test dependencies
        run: |
          python -m pip install \
            'numpy==1.26.0' \
            'pandas==2.1.0' \
            'scipy==1.15.0' \
            'jsonschema>=4.23,<5' \
            'psutil==5.9.0' \
            'pytest>=8,<9'
          python -m pip install --no-deps -e .
      - name: Run tests at the declared dependency floor
        run: python -m pytest

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build source and wheel distributions
        run: |
          python -m pip install build twine
          python -m build
      - name: Validate distribution metadata and archive contents
        run: |
          python -m twine check --strict dist/*
          python scripts/validate_distributions.py dist
      - name: Install and smoke-test the wheel outside the source tree
        run: |
          python -m venv /tmp/deapack-wheel-smoke
          /tmp/deapack-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/deapack-wheel-smoke/bin/python \
            "$GITHUB_WORKSPACE/scripts/smoke_installed_distribution.py"
          /tmp/deapack-wheel-smoke/bin/python -m pip check
      - name: Install and smoke-test the unpacked software sdist
        run: |
          mkdir -p /tmp/deapack-sdist-source
          tar --extract --gzip --file dist/*.tar.gz \
            --directory /tmp/deapack-sdist-source --strip-components=1
          python -m venv /tmp/deapack-sdist-reproduction
          /tmp/deapack-sdist-reproduction/bin/python -m pip install \
            /tmp/deapack-sdist-source
          cd /tmp
          /tmp/deapack-sdist-reproduction/bin/python \
            "$GITHUB_WORKSPACE/scripts/smoke_installed_distribution.py"
          /tmp/deapack-sdist-reproduction/bin/python -m pip check
      - name: Upload validated distributions
        # Ordinary CI is validation-only. Public artifacts are emitted only by
        # the protected, manually approved publication workflows.
        if: ${{ false }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deapack-distributions
          path: dist/*
          if-no-files-found: error
