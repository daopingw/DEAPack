name: Documentation

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  LC_ALL: C
  LANG: C

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/release-python312.txt
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and documentation dependencies
        run: |
          python -m pip install --constraint "$PIP_CONSTRAINT" pip setuptools
          python -m pip install --constraint "$PIP_CONSTRAINT" -e '.[docs,viz]'
          python scripts/release_toolchain.py verify-installed \
            --profile docs --require-ci-platform
      - name: Build package documentation
        run: sphinx-build -E -a -W --keep-going -b html docs _site/docs/en
      - name: Verify rendered Documentation identity and notices
        run: python scripts/verify_rendered_titles.py _site/docs/en
      - name: Execute reviewed documentation examples
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/deapack-matplotlib-doc-examples
          MPL_IGNORE_SYSTEM_FONTS: "1"
        run: python scripts/run_documentation_examples.py --include-visualization
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        # Build and verify on every configured ref, but never expose the
        # rendered site from ordinary CI. Publication is a protected action.
        if: ${{ false }}
        with:
          name: deapack-documentation-html
          path: _site/docs/en
