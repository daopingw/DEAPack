name: DCO

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signed-off-commits:
    name: Signed-off commits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the exact pull-request head without executing its code
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$PR_HEAD_SHA" = "$(printf '%s' "$PR_HEAD_SHA" | tr -cd '0-9a-f')"
          test "${#PR_HEAD_SHA}" -eq 40
          git fetch --no-tags --force origin \
            "pull/${PR_NUMBER}/head:refs/remotes/origin/deapack-dco-head"
          test "$PR_HEAD_SHA" = "$(git rev-parse refs/remotes/origin/deapack-dco-head)"
      - name: Require a DCO 1.1 Signed-off-by trailer on every pull-request commit
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -I -S scripts/check_dco.py \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA"
