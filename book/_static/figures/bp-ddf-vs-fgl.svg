<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
<title id="title">BP-DDF and BP-FGL aggregation</title>
<desc id="description">BP-DDF takes the smaller of two directional distances and can stop when one is zero, whereas BP-FGL averages two efficiency components and equals one only when both equal one.</desc>
<defs>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#176b73"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97732"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#76528f"/></marker>
<marker id="axis-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#24323d"/></marker>
</defs>
<rect width="760" height="500" fill="white"/>
<rect x="70" y="62" width="280" height="372" rx="14" fill="#dceff0" opacity="0.35"/>
<text x="210.0" y="102" text-anchor="middle" font-size="23" font-weight="700" fill="#24323d">BP-DDF</text>
<rect x="410" y="62" width="280" height="372" rx="14" fill="#dceff0" opacity="0.35"/>
<text x="550.0" y="102" text-anchor="middle" font-size="23" font-weight="700" fill="#24323d">BP-FGL</text>
<text x="105" y="160" font-size="19" fill="#24323d">β¹ = 0.20</text>
<rect x="105" y="178" width="190" height="28" rx="5" fill="#dce5e7"/>
<rect x="105" y="178" width="152" height="28" rx="5" fill="#176b73"/>
<text x="105" y="260" font-size="19" fill="#24323d">β² = 0.00</text>
<rect x="105" y="278" width="190" height="28" rx="5" fill="#dce5e7"/>
<line x1="120" y1="338" x2="280" y2="338" stroke="#d97732" stroke-width="3" marker-end="url(#arrow-orange)"/>
<text x="210" y="385" text-anchor="middle" font-size="22" font-weight="700" fill="#d97732">min(β¹, β²) = 0</text>
<text x="445" y="160" font-size="19" fill="#24323d">E¹ = 0.70</text>
<rect x="445" y="178" width="190" height="28" rx="5" fill="#dce5e7"/>
<rect x="445" y="178" width="133" height="28" rx="5" fill="#176b73"/>
<text x="445" y="260" font-size="19" fill="#24323d">E² = 1.00</text>
<rect x="445" y="278" width="190" height="28" rx="5" fill="#76528f"/>
<line x1="460" y1="338" x2="620" y2="338" stroke="#d97732" stroke-width="3" marker-end="url(#arrow-orange)"/>
<text x="550" y="385" text-anchor="middle" font-size="22" font-weight="700" fill="#d97732">(E¹ + E²) / 2 = 0.85</text>
</svg>
