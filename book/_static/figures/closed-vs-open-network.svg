<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-labelledby="title description">
  <title id="title">Closed production chain and open branching network</title>
  <desc id="description">The closed chain receives all external resources before its first process and releases all final outcomes after its last. The open network lets resources enter and outcomes leave at several processes, with distinct internal links branching, rejoining, or skipping a process.</desc>
  <defs>
    <marker id="flow-input" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#176b73"/>
    </marker>
    <marker id="flow-link" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#d97732"/>
    </marker>
    <marker id="flow-output" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#76528f"/>
    </marker>
    <filter id="open-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="720" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="42" font-size="23" font-weight="700" fill="#24323d">Where work enters and leaves changes the performance account</text>
    <text x="40" y="70" font-size="15" fill="#5c6b73">A network graph records organizational boundaries—not merely the order of boxes in a diagram.</text>
    <line x1="48" y1="101" x2="90" y2="101" stroke="#176b73" stroke-width="4" marker-end="url(#flow-input)"/>
    <text x="102" y="106" font-size="13" fill="#24323d">external resource enters</text>
    <line x1="291" y1="101" x2="333" y2="101" stroke="#d97732" stroke-width="4" marker-end="url(#flow-link)"/>
    <text x="345" y="106" font-size="13" fill="#24323d">internal link</text>
    <line x1="466" y1="101" x2="508" y2="101" stroke="#76528f" stroke-width="4" marker-end="url(#flow-output)"/>
    <text x="520" y="106" font-size="13" fill="#24323d">result leaves the system</text>
    <rect x="40" y="133" width="374" height="514" rx="16" fill="#f7f9fa" stroke="#cfdadd"/>
    <rect x="438" y="133" width="602" height="514" rx="16" fill="#fffaf5" stroke="#e5b58f"/>
    <text x="65" y="170" font-size="14" font-weight="700" fill="#5c6b73">CLOSED SERIES CHAIN</text>
    <text x="65" y="195" font-size="15" fill="#24323d">All resources enter first; all outcomes leave last.</text>
    <g filter="url(#open-shadow)">
      <rect x="77" y="228" width="132" height="50" rx="25" fill="#eef7f7" stroke="#9fc8cb"/>
      <rect x="236" y="218" width="142" height="70" rx="11" fill="#ffffff" stroke="#9fc8cb"/>
      <rect x="236" y="352" width="142" height="70" rx="11" fill="#ffffff" stroke="#e5b58f"/>
      <rect x="236" y="486" width="142" height="70" rx="11" fill="#ffffff" stroke="#c6b2d3"/>
      <rect x="77" y="496" width="132" height="50" rx="25" fill="#f3eef7" stroke="#c6b2d3"/>
    </g>
    <text x="143" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#176b73">all resources</text>
    <text x="307" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#176b73">PROCESS 1</text>
    <text x="307" y="271" text-anchor="middle" font-size="15" fill="#24323d">create handoff</text>
    <text x="307" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#d97732">ONE LINK</text>
    <text x="307" y="405" text-anchor="middle" font-size="15" fill="#24323d">intermediate z</text>
    <text x="307" y="516" text-anchor="middle" font-size="12" font-weight="700" fill="#76528f">PROCESS 2</text>
    <text x="307" y="539" text-anchor="middle" font-size="15" fill="#24323d">deliver outcome</text>
    <text x="143" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#76528f">all outcomes</text>
    <line x1="209" y1="253" x2="226" y2="253" stroke="#176b73" stroke-width="3" marker-end="url(#flow-input)"/>
    <line x1="307" y1="288" x2="307" y2="342" stroke="#d97732" stroke-width="3" marker-end="url(#flow-link)"/>
    <line x1="307" y1="422" x2="307" y2="476" stroke="#d97732" stroke-width="3" marker-end="url(#flow-link)"/>
    <line x1="236" y1="521" x2="219" y2="521" stroke="#76528f" stroke-width="3" marker-end="url(#flow-output)"/>
    <rect x="66" y="584" width="322" height="42" rx="9" fill="#24323d"/>
    <text x="227" y="610" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Useful—but too restrictive for many organizations.</text>
    <text x="463" y="170" font-size="14" font-weight="700" fill="#d97732">OPEN DAG · BRANCHES AND SKIP LINKS</text>
    <text x="463" y="195" font-size="15" fill="#24323d">Resources and results cross the boundary where they belong.</text>
    <g filter="url(#open-shadow)">
      <rect x="650" y="220" width="178" height="68" rx="11" fill="#ffffff" stroke="#9fc8cb"/>
      <rect x="500" y="358" width="178" height="68" rx="11" fill="#ffffff" stroke="#e5b58f"/>
      <rect x="800" y="358" width="178" height="68" rx="11" fill="#ffffff" stroke="#e5b58f"/>
      <rect x="650" y="514" width="178" height="68" rx="11" fill="#ffffff" stroke="#c6b2d3"/>
    </g>
    <text x="739" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#176b73">ORIGIN PROCESS</text>
    <text x="739" y="270" text-anchor="middle" font-size="15" fill="#24323d">creates several flows</text>
    <text x="589" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#d97732">BRANCH A</text>
    <text x="589" y="408" text-anchor="middle" font-size="15" fill="#24323d">uses new resources</text>
    <text x="889" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#d97732">BRANCH B</text>
    <text x="889" y="408" text-anchor="middle" font-size="15" fill="#24323d">releases a result</text>
    <text x="739" y="541" text-anchor="middle" font-size="12" font-weight="700" fill="#76528f">FINISH PROCESS</text>
    <text x="739" y="564" text-anchor="middle" font-size="15" fill="#24323d">rejoins the work</text>
    <rect x="470" y="229" width="126" height="48" rx="24" fill="#eef7f7" stroke="#9fc8cb"/>
    <text x="533" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#176b73">initial resource</text>
    <line x1="596" y1="253" x2="640" y2="253" stroke="#176b73" stroke-width="3" marker-end="url(#flow-input)"/>
    <rect x="456" y="366" width="34" height="52" rx="17" fill="#eef7f7" stroke="#9fc8cb"/>
    <text x="473" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#176b73">+</text>
    <line x1="484" y1="392" x2="496" y2="392" stroke="#176b73" stroke-width="3" marker-end="url(#flow-input)"/>
    <path d="M690 288 C650 318 622 329 592 348" fill="none" stroke="#d97732" stroke-width="3" marker-end="url(#flow-link)"/>
    <path d="M788 288 C828 318 856 329 886 348" fill="none" stroke="#d97732" stroke-width="3" marker-end="url(#flow-link)"/>
    <path d="M624 426 C645 469 677 484 711 504" fill="none" stroke="#d97732" stroke-width="3" marker-end="url(#flow-link)"/>
    <path d="M854 426 C833 469 801 484 767 504" fill="none" stroke="#d97732" stroke-width="3" marker-end="url(#flow-link)"/>
    <path d="M815 278 C1004 305 1015 490 828 535" fill="none" stroke="#d97732" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#flow-link)"/>
    <text x="1000" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#d97732">skip link</text>
    <rect x="985" y="365" width="34" height="52" rx="17" fill="#f3eef7" stroke="#c6b2d3"/>
    <text x="1002" y="396" text-anchor="middle" font-size="18" font-weight="700" fill="#76528f">↗</text>
    <line x1="978" y1="392" x2="985" y2="392" stroke="#76528f" stroke-width="3" marker-end="url(#flow-output)"/>
    <rect x="850" y="519" width="152" height="48" rx="24" fill="#f3eef7" stroke="#c6b2d3"/>
    <text x="926" y="548" text-anchor="middle" font-size="13" font-weight="700" fill="#76528f">final outcome</text>
    <line x1="828" y1="548" x2="840" y2="548" stroke="#76528f" stroke-width="3" marker-end="url(#flow-output)"/>
    <text x="470" y="455" font-size="12" fill="#176b73">new resource enters</text>
    <text x="930" y="455" font-size="12" fill="#76528f">result leaves early</text>
    <rect x="463" y="598" width="552" height="28" rx="8" fill="#24323d"/>
    <text x="739" y="617" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Each boundary crossing belongs to the process that receives or creates it.</text>
    <rect x="40" y="672" width="1000" height="30" rx="8" fill="#24323d"/>
    <text x="540" y="692" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Open means organizationally open: it does not mean open data, open source, or an unbounded model.</text>
  </g>
</svg>
