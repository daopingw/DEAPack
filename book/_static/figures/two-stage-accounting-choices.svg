<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-labelledby="title description">
  <title id="title">Three performance accounts for one connected organization</title>
  <desc id="description">The same research and commercialization chain supports a system-only radial account, a relational product account, or an endogenous-share additive process attribution. The three reports answer different management questions even though they coordinate the same internal handoff.</desc>
  <defs>
    <marker id="choice-arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#176b73"/>
    </marker>
    <filter id="choice-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="690" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="42" font-size="23" font-weight="700" fill="#24323d">One organizational chain can support different performance accounts</text>
    <text x="40" y="70" font-size="15" fill="#5c6b73">The graph describes how work is organized; the reporting institution says what the board wants to learn.</text>
    <g filter="url(#choice-shadow)">
      <rect x="60" y="104" width="230" height="84" rx="12" fill="#eef7f7" stroke="#9fc8cb"/>
      <rect x="425" y="104" width="230" height="84" rx="12" fill="#fff4e9" stroke="#e5b58f"/>
      <rect x="790" y="104" width="230" height="84" rx="12" fill="#f3eef7" stroke="#c6b2d3"/>
    </g>
    <text x="175" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#176b73">PROCESS 1</text>
    <text x="175" y="166" text-anchor="middle" font-size="19" font-weight="700" fill="#176b73">Research</text>
    <text x="540" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#d97732">INTERNAL HANDOFF</text>
    <text x="540" y="166" text-anchor="middle" font-size="19" font-weight="700" fill="#d97732">Innovations z</text>
    <text x="905" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#76528f">PROCESS 2</text>
    <text x="905" y="166" text-anchor="middle" font-size="19" font-weight="700" fill="#76528f">Commercialization</text>
    <line x1="290" y1="146" x2="415" y2="146" stroke="#176b73" stroke-width="3" marker-end="url(#choice-arrow)"/>
    <line x1="655" y1="146" x2="780" y2="146" stroke="#176b73" stroke-width="3" marker-end="url(#choice-arrow)"/>
    <text x="540" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#5c6b73">SAME GRAPH AND HANDOFF · DIFFERENT REPORTING QUESTION</text>
    <g filter="url(#choice-shadow)">
      <rect x="30" y="250" width="320" height="300" rx="14" fill="#eef7f7" stroke="#9fc8cb"/>
      <rect x="380" y="250" width="320" height="300" rx="14" fill="#fff7ef" stroke="#e5b58f"/>
      <rect x="730" y="250" width="320" height="300" rx="14" fill="#f3eef7" stroke="#c6b2d3"/>
    </g>
    <text x="54" y="284" font-size="13" font-weight="700" fill="#176b73">SYSTEM-ONLY RADIAL</text>
    <text x="54" y="326" font-size="27" font-weight="700" fill="#24323d">E</text>
    <text x="54" y="362" font-size="15" fill="#24323d">How much external resource</text>
    <text x="54" y="386" font-size="15" fill="#24323d">does one coordinated plan require?</text>
    <rect x="54" y="418" width="272" height="94" rx="9" fill="#ffffff" stroke="#cfe0e2"/>
    <text x="190" y="445" text-anchor="middle" font-size="13" font-weight="700" fill="#176b73">BOARD-LEVEL REPORT</text>
    <text x="190" y="473" text-anchor="middle" font-size="14" fill="#24323d">process-specific peers</text>
    <text x="190" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#5c6b73">no process score</text>

    <text x="404" y="284" font-size="13" font-weight="700" fill="#a65119">RELATIONAL PRODUCT</text>
    <text x="404" y="326" font-size="27" font-weight="700" fill="#24323d">E = E₁ &#215; E₂</text>
    <text x="404" y="362" font-size="15" fill="#24323d">How do jointly necessary</text>
    <text x="404" y="386" font-size="15" fill="#24323d">process ratios compound?</text>
    <rect x="404" y="418" width="272" height="94" rx="9" fill="#ffffff" stroke="#ead0b9"/>
    <text x="540" y="445" text-anchor="middle" font-size="13" font-weight="700" fill="#a65119">SHARED LINK VALUATION</text>
    <text x="540" y="473" text-anchor="middle" font-size="14" fill="#24323d">selected process ratios</text>
    <text x="540" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#5c6b73">not a transfer price</text>

    <text x="754" y="284" font-size="13" font-weight="700" fill="#76528f">ADDITIVE PROCESS ATTRIBUTION</text>
    <text x="754" y="326" font-size="27" font-weight="700" fill="#24323d">E = &#945;₁E₁ + &#945;₂E₂</text>
    <text x="754" y="362" font-size="15" fill="#24323d">How is system performance</text>
    <text x="754" y="386" font-size="15" fill="#24323d">assigned across processes?</text>
    <rect x="754" y="418" width="272" height="94" rx="9" fill="#ffffff" stroke="#d9cde2"/>
    <text x="890" y="445" text-anchor="middle" font-size="13" font-weight="700" fill="#76528f">FITTED RESOURCE SHARES</text>
    <text x="890" y="473" text-anchor="middle" font-size="14" fill="#24323d">arithmetic attribution</text>
    <text x="890" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#5c6b73">not a budget or priority</text>

    <rect x="40" y="582" width="1000" height="60" rx="12" fill="#24323d"/>
    <text x="540" y="607" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">The link is stored once and coordinated at both endpoints.</text>
    <text x="540" y="629" text-anchor="middle" font-size="13" fill="#d7e2e5">Different accounts need not produce comparable scores, unique process stories, or causal explanations.</text>
    <text x="540" y="671" text-anchor="middle" font-size="13" fill="#687780">Choose the account from the decision question—not from whichever score is highest.</text>
  </g>
</svg>
