<text x="540" y="611" text-anchor="middle" font-size="13.5" font-weight="700" fill="#176b73">ONE JOINT OPERATING PLAN</text>
<text x="540" y="629" text-anchor="middle" font-size="12.5" fill="#24323d">Every handoff balances, every inherited state agrees, and every process-period target is attainable together.</text>
