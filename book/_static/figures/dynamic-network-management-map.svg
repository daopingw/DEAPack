<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title description">
<title id="title">A production network connected through time</title>
<desc id="description">Generation, grid, and customer-service processes exchange two internal handoffs in each period. Capacity, maintenance backlog, and service obligations connect the same process across periods. Every process-period peer plan enters one jointly feasible system appraisal.</desc>
<defs>
<marker id="dn-link" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#d97732"/></marker>
<marker id="dn-state-teal" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#176b73"/></marker>
<marker id="dn-state-orange" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#d97732"/></marker>
