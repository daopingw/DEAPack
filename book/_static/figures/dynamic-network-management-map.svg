<text x="540" y="698" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">SYSTEM EFFICIENCY IS A WEIGHTED PERFORMANCE ACCOUNT</text>
<text x="540" y="719" text-anchor="middle" font-size="12.5" fill="#d7e2e5">Process and period scores explain one selected joint optimum; they are not independent rankings or causal effects.</text>
