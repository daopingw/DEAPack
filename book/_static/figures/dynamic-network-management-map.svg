<text x="40" y="70" font-size="14.5" fill="#5c6b73">Within-period handoffs coordinate departments. Carry-overs prevent today's target from contradicting</text>
<text x="40" y="90" font-size="14.5" fill="#5c6b73">tomorrow's inherited position.</text>
