<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img" aria-labelledby="title description">
<title id="title">A directly actionable input excess in the source example</title>
<desc id="description">Organizations A and B use the same first input and produce the same output. B uses four units of the second input while A uses two, leaving two units avoidable.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#d97732"/>
</marker>
</defs>
<rect width="840" height="430" fill="#ffffff"/>
<text x="420" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#24323d">Same service commitment, different resource use</text>
<rect x="70" y="72" width="700" height="66" rx="12" fill="#eef5f5"/>
<text x="105" y="99" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#176b73">Held equal</text>
<text x="230" y="99" font-family="Arial, sans-serif" font-size="17" fill="#24323d">First input: 1</text>
<text x="470" y="99" font-family="Arial, sans-serif" font-size="17" fill="#24323d">Desirable output: 1</text>
<text x="105" y="123" font-family="Arial, sans-serif" font-size="14" fill="#687780">The performance difference comes entirely from the second resource.</text>
<line x1="150" y1="335" x2="710" y2="335" stroke="#24323d" stroke-width="2"/>
<line x1="150" y1="328" x2="150" y2="342" stroke="#24323d" stroke-width="2"/>
<line x1="290" y1="328" x2="290" y2="342" stroke="#24323d" stroke-width="2"/>
<line x1="430" y1="328" x2="430" y2="342" stroke="#24323d" stroke-width="2"/>
<line x1="570" y1="328" x2="570" y2="342" stroke="#24323d" stroke-width="2"/>
<line x1="710" y1="328" x2="710" y2="342" stroke="#24323d" stroke-width="2"/>
<text x="150" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#687780">0</text>
<text x="290" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#687780">1</text>
<text x="430" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#687780">2</text>
<text x="570" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#687780">3</text>
<text x="710" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#687780">4</text>
<text x="430" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#24323d">Units of the second input</text>
<rect x="150" y="184" width="280" height="42" rx="8" fill="#176b73"/>
<text x="165" y="212" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">A · represented target</text>
<rect x="150" y="254" width="560" height="42" rx="8" fill="#76528f"/>
<text x="165" y="282" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">B · observed use</text>
<line x1="700" y1="242" x2="440" y2="242" stroke="#d97732" stroke-width="4" marker-end="url(#arrow)"/>
<text x="570" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#d97732">2 units avoidable</text>
</svg>
