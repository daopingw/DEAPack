<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-labelledby="title description">
<title id="title">One declared programme, four benchmark appraisals</title>
<desc id="description">One common programme of resource saving and service expansion supplies the unit for appraising an old and a new operating plan against old and new production opportunities. The four directional distances enter an additive Luenberger change account.</desc>
<defs>
<filter id="lp-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/></filter>
</defs>
<rect width="900" height="680" fill="#ffffff"/>
<g font-family="Arial, sans-serif">
<text x="34" y="38" font-size="24" font-weight="700" fill="#24323d">One declared programme, four benchmark appraisals</text>
<text x="34" y="66" font-size="15" fill="#5c6b73">The unit of change is fixed before either period's plan is compared.</text>
<rect x="34" y="88" width="832" height="92" rx="14" fill="#24323d"/>
<text x="54" y="119" font-size="15" font-weight="700" fill="#ffffff">ONE COMMON PROGRAMME UNIT  g</text>
<rect x="285" y="103" width="232" height="38" rx="19" fill="#dceff0"/>
<text x="401" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#176b73">save g^x resource units</text>
<text x="539" y="129" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">+</text>
<rect x="560" y="103" width="280" height="38" rx="19" fill="#f8e8dc"/>
<text x="700" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#d97732">deliver g^y service units</text>
<text x="450" y="163" text-anchor="middle" font-size="14" fill="#d7e2e5">The physical unit remains unchanged in every appraisal.</text>
<text x="363" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#176b73">OLD OPPORTUNITIES  &#x1D4AF;^t</text>
<text x="683" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#76528f">NEW OPPORTUNITIES  &#x1D4AF;^(t+1)</text>
<text x="42" y="279" font-size="15" font-weight="700" fill="#24323d">OLD PLAN  z^t</text>
<text x="42" y="405" font-size="15" font-weight="700" fill="#24323d">NEW PLAN  z^(t+1)</text>
<rect x="205" y="238" width="316" height="100" rx="12" fill="#eef7f7" stroke="#176b73" filter="url(#lp-shadow)"/>
<text x="363" y="277" text-anchor="middle" font-size="21" font-weight="700" fill="#24323d">D^t(z^t; g)</text>
<text x="363" y="309" text-anchor="middle" font-size="14" fill="#5c6b73">own-period programme shortfall</text>
<rect x="545" y="238" width="316" height="100" rx="12" fill="#f3eef7" stroke="#76528f" filter="url(#lp-shadow)"/>
<text x="703" y="277" text-anchor="middle" font-size="21" font-weight="700" fill="#24323d">D^(t+1)(z^t; g)</text>
<text x="703" y="309" text-anchor="middle" font-size="14" fill="#5c6b73">old plan under new opportunities</text>
<rect x="205" y="364" width="316" height="100" rx="12" fill="#fff3e9" stroke="#d97732" filter="url(#lp-shadow)"/>
<text x="363" y="403" text-anchor="middle" font-size="21" font-weight="700" fill="#24323d">D^t(z^(t+1); g)</text>
<text x="363" y="435" text-anchor="middle" font-size="14" fill="#5c6b73">may be negative beyond old opportunities</text>
<rect x="545" y="364" width="316" height="100" rx="12" fill="#eef7f7" stroke="#176b73" filter="url(#lp-shadow)"/>
<text x="703" y="403" text-anchor="middle" font-size="21" font-weight="700" fill="#24323d">D^(t+1)(z^(t+1); g)</text>
<text x="703" y="435" text-anchor="middle" font-size="14" fill="#5c6b73">own-period programme shortfall</text>
<rect x="52" y="500" width="796" height="104" rx="14" fill="#f8fafb" stroke="#cfdadd"/>
<text x="76" y="530" font-size="14" font-weight="700" fill="#176b73">OLD BENCHMARK</text>
<text x="76" y="556" font-size="15" fill="#24323d">P^t = old plan's D^t - new plan's D^t</text>
<text x="488" y="530" font-size="14" font-weight="700" fill="#76528f">NEW BENCHMARK</text>
<text x="488" y="556" font-size="15" fill="#24323d">P^(t+1) = D^(t+1)(old) - D^(t+1)(new)</text>
<text x="450" y="588" text-anchor="middle" font-size="20" font-weight="700" fill="#d97732">L = 1/2 [P^t + P^(t+1)] = EC_L + TC_L</text>
<rect x="34" y="624" width="832" height="38" rx="10" fill="#24323d"/>
<text x="450" y="649" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">The account allocates change; it does not identify management or technology causes.</text>
</g>
</svg>
