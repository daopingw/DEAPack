<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
<title id="title">Local returns to scale as an operating response</title>
<desc id="description">Three cards compare how attainable service capacity responds to a ten percent proportional resource change near a selected efficient operating plan.</desc>
<defs>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#176b73"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97732"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#76528f"/></marker>
<marker id="axis-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#24323d"/></marker>
</defs>
<rect width="760" height="500" fill="white"/>
<text x="380.0" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#24323d">Near one selected efficient operating plan</text>
<text x="380.0" y="76" text-anchor="middle" font-size="15" fill="#687780">Compare a small proportional change in all resources and services</text>
<rect x="38" y="105" width="220" height="290" rx="18" fill="#dceff0" stroke="#176b73" stroke-width="2"/>
<text x="148" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#176b73">INCREASING RETURNS</text>
<text x="60" y="180" font-size="14" fill="#687780">Resources</text>
<rect x="60" y="193" width="132" height="22" rx="5" fill="#176b73" opacity="0.32"/>
<text x="223" y="211" text-anchor="end" font-size="22" font-weight="700" fill="#176b73">+10%</text>
<text x="60" y="250" font-size="14" fill="#687780">Attainable services</text>
<rect x="60" y="263" width="132" height="22" rx="5" fill="#176b73" opacity="0.7"/>
<text x="223" y="281" text-anchor="end" font-size="22" font-weight="700" fill="#176b73">+15%</text>
<line x1="60" y1="309" x2="236" y2="309" stroke="#176b73" stroke-width="1.5" opacity="0.55"/>
<text x="148" y="340" text-anchor="middle" font-size="15" font-weight="600" fill="#24323d">Service capacity grows</text>
<text x="148" y="363" text-anchor="middle" font-size="15" font-weight="600" fill="#24323d">more than resources</text>
<rect x="270" y="105" width="220" height="290" rx="18" fill="#f8e8dc" stroke="#d97732" stroke-width="2"/>
<text x="380" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#d97732">CONSTANT RETURNS</text>
<text x="292" y="180" font-size="14" fill="#687780">Resources</text>
<rect x="292" y="193" width="132" height="22" rx="5" fill="#d97732" opacity="0.32"/>
<text x="455" y="211" text-anchor="end" font-size="22" font-weight="700" fill="#d97732">+10%</text>
<text x="292" y="250" font-size="14" fill="#687780">Attainable services</text>
<rect x="292" y="263" width="132" height="22" rx="5" fill="#d97732" opacity="0.7"/>
<text x="455" y="281" text-anchor="end" font-size="22" font-weight="700" fill="#d97732">+10%</text>
<line x1="292" y1="309" x2="468" y2="309" stroke="#d97732" stroke-width="1.5" opacity="0.55"/>
<text x="380" y="340" text-anchor="middle" font-size="15" font-weight="600" fill="#24323d">Service capacity and</text>
<text x="380" y="363" text-anchor="middle" font-size="15" font-weight="600" fill="#24323d">resources grow together</text>
<rect x="502" y="105" width="220" height="290" rx="18" fill="#eee8f3" stroke="#76528f" stroke-width="2"/>
<text x="612" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#76528f">DECREASING RETURNS</text>
<text x="524" y="180" font-size="14" fill="#687780">Resources</text>
<rect x="524" y="193" width="132" height="22" rx="5" fill="#76528f" opacity="0.32"/>
<text x="687" y="211" text-anchor="end" font-size="22" font-weight="700" fill="#76528f">+10%</text>
<text x="524" y="250" font-size="14" fill="#687780">Attainable services</text>
<rect x="524" y="263" width="132" height="22" rx="5" fill="#76528f" opacity="0.7"/>
<text x="687" y="281" text-anchor="end" font-size="22" font-weight="700" fill="#76528f">+6%</text>
<line x1="524" y1="309" x2="700" y2="309" stroke="#76528f" stroke-width="1.5" opacity="0.55"/>
<text x="612" y="340" text-anchor="middle" font-size="15" font-weight="600" fill="#24323d">Service capacity grows</text>
<text x="612" y="363" text-anchor="middle" font-size="15" font-weight="600" fill="#24323d">less than resources</text>
<rect x="96" y="424" width="568" height="48" rx="13" fill="white" stroke="#dce5e7" stroke-width="2"/>
<text x="380.0" y="447" text-anchor="middle" font-size="14" font-weight="700" fill="#24323d">The diagnosis belongs to the selected frontier plan</text>
<text x="380.0" y="466" text-anchor="middle" font-size="13" fill="#687780">It does not by itself prescribe expansion, contraction, or investment</text>
</svg>
