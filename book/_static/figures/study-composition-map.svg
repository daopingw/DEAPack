<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
<title id="title">From a management question to a defensible conclusion</title>
<desc id="description">A flow diagram shows purpose and commitments, organizational responsibility, and comparable evidence entering a comparison contract, which produces a performance finding, operating evidence, and a bounded conclusion.</desc>
<defs>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#176b73"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97732"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#76528f"/></marker>
<marker id="axis-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#24323d"/></marker>
</defs>
<rect width="760" height="500" fill="white"/>
<text x="380.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#24323d">A defensible performance study</text>
<text x="42" y="82" font-size="16" font-weight="700" fill="#176b73">Define the decision</text>
<text x="292" y="82" font-size="16" font-weight="700" fill="#76528f">State the comparison</text>
<text x="570" y="82" font-size="16" font-weight="700" fill="#d97732">Use the evidence</text>
<rect x="34" y="102" width="206" height="70" rx="10" fill="#dceff0" stroke="#176b73" stroke-width="2"/>
<text x="52" y="129" font-size="16" font-weight="700" fill="#24323d">Purpose and commitment</text>
<text x="52" y="152" font-size="12.5" fill="#687780">what must remain or improve</text>
<rect x="34" y="202" width="206" height="70" rx="10" fill="#dceff0" stroke="#176b73" stroke-width="2"/>
<text x="52" y="229" font-size="16" font-weight="700" fill="#24323d">Responsibility and time</text>
<text x="52" y="252" font-size="12.5" fill="#687780">what can change, and when</text>
<rect x="34" y="302" width="206" height="70" rx="10" fill="#dceff0" stroke="#176b73" stroke-width="2"/>
<text x="52" y="329" font-size="16" font-weight="700" fill="#24323d">Comparable evidence</text>
<text x="52" y="352" font-size="12.5" fill="#687780">who may teach whom</text>
<rect x="285" y="102" width="238" height="270" rx="13" fill="#eee8f3" stroke="#76528f" stroke-width="3"/>
<text x="404" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#76528f">Comparison contract</text>
<rect x="307" y="151" width="194" height="34" rx="7" fill="white" stroke="#cbbbd5" stroke-width="1.5"/>
<text x="404" y="173" text-anchor="middle" font-size="13.5" fill="#24323d">unit and time boundary</text>
<rect x="307" y="197" width="194" height="34" rx="7" fill="white" stroke="#cbbbd5" stroke-width="1.5"/>
<text x="404" y="219" text-anchor="middle" font-size="13.5" fill="#24323d">resources, services, harms</text>
<rect x="307" y="243" width="194" height="34" rx="7" fill="white" stroke="#cbbbd5" stroke-width="1.5"/>
<text x="404" y="265" text-anchor="middle" font-size="13.5" fill="#24323d">eligible comparison group</text>
<rect x="307" y="289" width="194" height="34" rx="7" fill="white" stroke="#cbbbd5" stroke-width="1.5"/>
<text x="404" y="311" text-anchor="middle" font-size="13.5" fill="#24323d">attainable-plan assumptions</text>
<rect x="307" y="335" width="194" height="34" rx="7" fill="white" stroke="#cbbbd5" stroke-width="1.5"/>
<text x="404" y="357" text-anchor="middle" font-size="13.5" fill="#24323d">measure and conclusion limits</text>
<rect x="566" y="102" width="166" height="70" rx="10" fill="#f8e8dc" stroke="#d97732" stroke-width="2"/>
<text x="582" y="129" font-size="14" font-weight="700" fill="#24323d">Performance finding</text>
<text x="582" y="152" font-size="11.5" fill="#687780">defined measure and benchmark</text>
<rect x="566" y="202" width="166" height="70" rx="10" fill="#f8e8dc" stroke="#d97732" stroke-width="2"/>
<text x="582" y="229" font-size="14" font-weight="700" fill="#24323d">Operating evidence</text>
<text x="582" y="252" font-size="11.5" fill="#687780">targets, gaps, and peers</text>
<rect x="566" y="302" width="166" height="70" rx="10" fill="#f8e8dc" stroke="#d97732" stroke-width="2"/>
<text x="582" y="329" font-size="14" font-weight="700" fill="#24323d">Strength of conclusion</text>
<text x="582" y="352" font-size="11.5" fill="#687780">uncertainty and limits</text>
<line x1="240" y1="137" x2="278" y2="137" stroke="#176b73" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<line x1="523" y1="137" x2="559" y2="137" stroke="#d97732" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
<line x1="240" y1="237" x2="278" y2="237" stroke="#176b73" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<line x1="523" y1="237" x2="559" y2="237" stroke="#d97732" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
<line x1="240" y1="337" x2="278" y2="337" stroke="#176b73" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<line x1="523" y1="337" x2="559" y2="337" stroke="#d97732" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
<rect x="94" y="414" width="572" height="54" rx="11" fill="white" stroke="#dce5e7" stroke-width="2"/>
<text x="380.0" y="437" text-anchor="middle" font-size="14" font-weight="700" fill="#24323d">Every result is conditional on the comparison contract</text>
<text x="380.0" y="457" text-anchor="middle" font-size="12.5" fill="#687780">Change the contract, and the management question changes.</text>
</svg>
