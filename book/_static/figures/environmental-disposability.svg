<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
<title id="title">Weak and strong disposability of undesirable output</title>
<desc id="description">Weak disposability reduces desirable and undesirable outputs together, whereas strong disposability reduces undesirable output while holding desirable output fixed.</desc>
<defs>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#176b73"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97732"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#76528f"/></marker>
<marker id="axis-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#24323d"/></marker>
</defs>
<rect width="760" height="500" fill="white"/>
<rect x="62" y="58" width="315" height="400" rx="12" fill="#dceff0" opacity="0.32"/>
<line x1="82" y1="420" x2="345" y2="420" stroke="#24323d" stroke-width="2" marker-end="url(#axis-arrow)"/>
<line x1="82" y1="420" x2="82" y2="92" stroke="#24323d" stroke-width="2" marker-end="url(#axis-arrow)"/>
<text x="355" y="427" font-size="18" font-style="italic" fill="#24323d">y</text>
<text x="75" y="80" font-size="18" font-style="italic" fill="#24323d">b</text>
<text x="213.5" y="80" text-anchor="middle" font-size="19" font-weight="600" fill="#24323d">weak</text>
<rect x="395" y="58" width="315" height="400" rx="12" fill="#dceff0" opacity="0.32"/>
<line x1="415" y1="420" x2="678" y2="420" stroke="#24323d" stroke-width="2" marker-end="url(#axis-arrow)"/>
<line x1="415" y1="420" x2="415" y2="92" stroke="#24323d" stroke-width="2" marker-end="url(#axis-arrow)"/>
<text x="688" y="427" font-size="18" font-style="italic" fill="#24323d">y</text>
<text x="408" y="80" font-size="18" font-style="italic" fill="#24323d">b</text>
<text x="546.5" y="80" text-anchor="middle" font-size="19" font-weight="600" fill="#24323d">strong</text>
<line x1="82" y1="420" x2="300" y2="145" stroke="#dce5e7" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="300" y1="145" x2="190" y2="282" stroke="#76528f" stroke-width="4" marker-end="url(#arrow-purple)"/>
<circle cx="300" cy="145" r="8" fill="#d97732" stroke="white" stroke-width="2"/>
<circle cx="190" cy="282" r="7" fill="white" stroke="#76528f" stroke-width="3"/>
<text x="311" y="136" font-size="17" fill="#d97732">(y, b)</text>
<text x="185" y="307" text-anchor="middle" font-size="17" fill="#76528f">&#945;(y, b)</text>
<line x1="635" y1="145" x2="635" y2="315" stroke="#176b73" stroke-width="4" marker-end="url(#arrow-teal)"/>
<circle cx="635" cy="145" r="8" fill="#d97732" stroke="white" stroke-width="2"/>
<circle cx="635" cy="315" r="7" fill="white" stroke="#176b73" stroke-width="3"/>
