<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-labelledby="title description">
  <title id="title">Two core link policies in network SBM</title>
  <desc id="description">Two panels contrast a fixed observed handoff with a freely coordinated handoff. Both require the supplier and recipient peer plans to use one compatible target.</desc>
  <defs>
    <marker id="nsbm-arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#d97732"/>
    </marker>
    <filter id="nsbm-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="580" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="42" font-size="23" font-weight="700" fill="#24323d">One handoff, two core governance questions</text>
    <text x="40" y="70" font-size="15" fill="#5c6b73">Both policies keep the supplier and recipient plans consistent; the difference is whether management may redesign the flow.</text>
    <g filter="url(#nsbm-shadow)">
      <rect x="40" y="104" width="486" height="354" rx="16" fill="#f7f9fa" stroke="#cfdadd"/>
      <rect x="554" y="104" width="486" height="354" rx="16" fill="#fffaf5" stroke="#e5b58f"/>
    </g>
    <text x="66" y="142" font-size="14" font-weight="700" fill="#5c6b73">FIXED · INHERIT THE COMMITMENT</text>
    <text x="580" y="142" font-size="14" font-weight="700" fill="#d97732">FREE · COORDINATE A REDESIGN</text>
    <text x="66" y="174" font-size="14" fill="#24323d">Both divisions must reproduce the observed flow.</text>
    <text x="580" y="174" font-size="14" fill="#24323d">Both divisions choose one common feasible flow.</text>
    <g fill="#ffffff" stroke-width="1.5">
      <rect x="68" y="218" width="142" height="70" rx="10" stroke="#9fc8cb"/>
      <rect x="356" y="218" width="142" height="70" rx="10" stroke="#c6b2d3"/>
      <rect x="582" y="218" width="142" height="70" rx="10" stroke="#9fc8cb"/>
      <rect x="870" y="218" width="142" height="70" rx="10" stroke="#c6b2d3"/>
    </g>
    <g font-size="12" font-weight="700">
      <text x="139" y="244" text-anchor="middle" fill="#176b73">SUPPLIER</text>
      <text x="427" y="244" text-anchor="middle" fill="#76528f">RECIPIENT</text>
      <text x="653" y="244" text-anchor="middle" fill="#176b73">SUPPLIER</text>
      <text x="941" y="244" text-anchor="middle" fill="#76528f">RECIPIENT</text>
    </g>
    <g font-size="13" fill="#24323d">
      <text x="139" y="272" text-anchor="middle">&#955; supplier</text>
      <text x="427" y="272" text-anchor="middle">&#955; recipient</text>
      <text x="653" y="272" text-anchor="middle">&#955; supplier</text>
      <text x="941" y="272" text-anchor="middle">&#955; recipient</text>
    </g>
    <g stroke="#d97732" stroke-width="4" marker-end="url(#nsbm-arrow)">
      <line x1="210" y1="253" x2="346" y2="253"/>
      <line x1="724" y1="253" x2="860" y2="253"/>
    </g>
    <g font-size="16" font-weight="700" fill="#24323d">
      <text x="283" y="334" text-anchor="middle">Z&#955; supplier = z observed = Z&#955; recipient</text>
      <text x="797" y="334" text-anchor="middle">Z&#955; supplier = Z&#955; recipient = z*</text>
    </g>
    <g font-size="13.5" fill="#5c6b73">
      <text x="283" y="374" text-anchor="middle">Management conditions on the inherited quantity.</text>
      <text x="283" y="400" text-anchor="middle">The common target cannot move away from observation.</text>
      <text x="797" y="374" text-anchor="middle">Management may redesign the quantity jointly.</text>
      <text x="797" y="400" text-anchor="middle">The two processes still cannot choose different targets.</text>
    </g>
    <rect x="40" y="488" width="1000" height="62" rx="13" fill="#24323d"/>
    <text x="540" y="515" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ONE ORGANIZATION, ONE HANDOFF TARGET</text>
    <text x="540" y="538" text-anchor="middle" font-size="13.5" fill="#ffffff">Fixed protects the observed commitment; free reveals what coordinated redesign could make attainable.</text>
  </g>
</svg>
