<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title description">
<title id="title">Hicks--Moorsteen total-factor-productivity accounting</title>
<desc id="description">Hicks--Moorsteen total-factor-productivity change from t to t+1 is the ratio of a bilateral output quantity index to a bilateral input quantity index. Each period technology supplies one output and one input quantity comparison.</desc>
<defs>
<filter id="hm-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/></filter>
</defs>
<rect width="900" height="650" fill="#ffffff"/>
<g font-family="Arial, sans-serif">
<text x="450" y="39" text-anchor="middle" font-size="24" font-weight="700" fill="#24323d">Hicks--Moorsteen total-factor-productivity change</text>
<rect x="38" y="66" width="824" height="94" rx="15" fill="#eef6f7" stroke="#176b73" stroke-width="2" filter="url(#hm-shadow)"/>
<text x="450" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#176b73">HM^(t,t+1) = output quantity index Q_y^(t,t+1) / input quantity index Q_x^(t,t+1)</text>
<text x="450" y="136" text-anchor="middle" font-size="15" fill="#40515c">Productivity rises when output quantity grows faster than input quantity.</text>
<rect x="35" y="190" width="405" height="282" rx="16" fill="#f2f8f8" stroke="#176b73" stroke-width="2.5" filter="url(#hm-shadow)"/>
<text x="59" y="224" font-size="18" font-weight="700" fill="#176b73">Base-period perspective: &#x1D4AF;^t</text>
<text x="59" y="250" font-size="14" fill="#40515c">The base-period opportunities judge both quantity bundles.</text>
<rect x="59" y="272" width="357" height="76" rx="10" fill="#ffffff" stroke="#9cc8cc"/>
<text x="79" y="303" font-size="17" font-weight="700" fill="#176b73">Output quantity, Q_y^t</text>
<text x="79" y="330" font-size="14" fill="#40515c">Hold x^t fixed; compare y^t with y^(t+1)</text>
<rect x="59" y="365" width="357" height="76" rx="10" fill="#ffffff" stroke="#9cc8cc"/>
<text x="79" y="396" font-size="17" font-weight="700" fill="#176b73">Input quantity, Q_x^t</text>
<text x="79" y="423" font-size="14" fill="#40515c">Hold y^t fixed; compare x^t with x^(t+1)</text>
<rect x="460" y="190" width="405" height="282" rx="16" fill="#f5f1f8" stroke="#76528f" stroke-width="2.5" filter="url(#hm-shadow)"/>
<text x="484" y="224" font-size="16" font-weight="700" fill="#76528f">Comparison-period perspective: &#x1D4AF;^(t+1)</text>
<text x="484" y="250" font-size="14" fill="#40515c">Later opportunities supply the second bilateral view.</text>
<rect x="484" y="272" width="357" height="76" rx="10" fill="#ffffff" stroke="#c5b3d2"/>
<text x="504" y="303" font-size="17" font-weight="700" fill="#76528f">Output quantity, Q_y^(t+1)</text>
<text x="504" y="330" font-size="14" fill="#40515c">Hold x^(t+1) fixed; compare output bundles</text>
<rect x="484" y="365" width="357" height="76" rx="10" fill="#ffffff" stroke="#c5b3d2"/>
<text x="504" y="396" font-size="17" font-weight="700" fill="#76528f">Input quantity, Q_x^(t+1)</text>
<text x="504" y="423" font-size="14" fill="#40515c">Hold y^(t+1) fixed; compare input bundles</text>
<rect x="68" y="500" width="764" height="126" rx="16" fill="#fff7ef" stroke="#d97732" stroke-width="2" filter="url(#hm-shadow)"/>
<text x="450" y="532" text-anchor="middle" font-size="18" font-weight="700" fill="#9a4d17">Reconcile the two period views symmetrically</text>
<text x="450" y="565" text-anchor="middle" font-size="15" fill="#24323d">Q_y^(t,t+1) = &#x221A;(Q_y^t &#xD7; Q_y^(t+1))</text>
<text x="450" y="591" text-anchor="middle" font-size="15" fill="#24323d">Q_x^(t,t+1) = &#x221A;(Q_x^t &#xD7; Q_x^(t+1))</text>
<text x="450" y="616" text-anchor="middle" font-size="16" font-weight="700" fill="#24323d">HM^(t,t+1) = Q_y^(t,t+1) / Q_x^(t,t+1)</text>
</g>
</svg>
