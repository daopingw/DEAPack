<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
<title id="title">Technical saving and material-mix improvement</title>
<desc id="description">Four fixed-output production plans show how DMU D first removes proportional resource waste at C and then changes the input mix toward the minimum-material plan B.</desc>
<defs>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#176b73"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97732"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#76528f"/></marker>
<marker id="axis-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#24323d"/></marker>
</defs>
<rect width="760" height="500" fill="white"/>
<line x1="220.22" y1="48" x2="220.22" y2="438" stroke="#dce5e7" stroke-width="1"/>
<text x="220.22" y="463" text-anchor="middle" font-size="14" fill="#687780">1</text>
<line x1="358.44" y1="48" x2="358.44" y2="438" stroke="#dce5e7" stroke-width="1"/>
<text x="358.44" y="463" text-anchor="middle" font-size="14" fill="#687780">2</text>
<line x1="496.67" y1="48" x2="496.67" y2="438" stroke="#dce5e7" stroke-width="1"/>
<text x="496.67" y="463" text-anchor="middle" font-size="14" fill="#687780">3</text>
<line x1="634.89" y1="48" x2="634.89" y2="438" stroke="#dce5e7" stroke-width="1"/>
<text x="634.89" y="463" text-anchor="middle" font-size="14" fill="#687780">4</text>
<line x1="82" y1="351.33" x2="704" y2="351.33" stroke="#dce5e7" stroke-width="1"/>
<text x="64" y="356.33" text-anchor="end" font-size="14" fill="#687780">1</text>
<line x1="82" y1="264.67" x2="704" y2="264.67" stroke="#dce5e7" stroke-width="1"/>
<text x="64" y="269.67" text-anchor="end" font-size="14" fill="#687780">2</text>
<line x1="82" y1="178.00" x2="704" y2="178.00" stroke="#dce5e7" stroke-width="1"/>
<text x="64" y="183.00" text-anchor="end" font-size="14" fill="#687780">3</text>
<line x1="82" y1="91.33" x2="704" y2="91.33" stroke="#dce5e7" stroke-width="1"/>
<text x="64" y="96.33" text-anchor="end" font-size="14" fill="#687780">4</text>
<line x1="82" y1="438" x2="716" y2="438" stroke="#24323d" stroke-width="2" marker-end="url(#axis-arrow)"/>
<line x1="82" y1="438" x2="82" y2="36" stroke="#24323d" stroke-width="2" marker-end="url(#axis-arrow)"/>
<text x="724" y="444" font-size="18" font-style="italic" fill="#24323d">x₁</text>
<text x="77" y="26" font-size="18" font-style="italic" fill="#24323d">x₂</text>
<path d="M 220.22 178.00 L 496.67 351.33 L 704.00 351.33 L 704.00 48.00 L 220.22 48.00 Z" fill="#dceff0" opacity="0.62"/>
<path d="M 220.22 178.00 L 496.67 351.33" fill="none" stroke="#176b73" stroke-width="4" stroke-linecap="round"/>
<line x1="82.00" y1="264.67" x2="704.00" y2="394.67" stroke="#76528f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="696.00" y="386.67" text-anchor="end" font-size="14" fill="#76528f">N = 6</text>
<line x1="82.00" y1="206.89" x2="704.00" y2="336.89" stroke="#d97732" stroke-width="2" stroke-dasharray="8 6"/>
<text x="696.00" y="328.89" text-anchor="end" font-size="14" fill="#d97732">N = 8</text>
<line x1="427.56" y1="48.00" x2="704.00" y2="105.78" stroke="#687780" stroke-width="2" stroke-dasharray="8 6"/>
<text x="696.00" y="97.78" text-anchor="end" font-size="14" fill="#687780">N = 16</text>
<circle cx="220.22" cy="178.00" r="6" fill="#24323d" stroke="white" stroke-width="2"/>
<text x="230.22" y="168.00" font-size="16" font-weight="600" fill="#24323d">A</text>
<circle cx="496.67" cy="351.33" r="8" fill="#76528f" stroke="white" stroke-width="2"/>
<text x="506.67" y="341.33" font-size="16" font-weight="600" fill="#76528f">B</text>
<circle cx="358.44" cy="264.67" r="8" fill="#d97732" stroke="white" stroke-width="2"/>
<text x="336.44" y="254.67" font-size="16" font-weight="600" fill="#d97732">C</text>
<circle cx="634.89" cy="91.33" r="8" fill="#d97732" stroke="white" stroke-width="2"/>
<text x="644.89" y="81.33" font-size="16" font-weight="600" fill="#d97732">D</text>
<line x1="627.89" y1="98.33" x2="366.44" y2="256.67" stroke="#d97732" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="510.67" y="168.00" font-size="15" fill="#d97732">common resource saving</text>
<text x="510.67" y="188.00" font-size="15" fill="#d97732">TE = 0.50</text>
<line x1="366.44" y1="272.67" x2="488.67" y2="343.33" stroke="#76528f" stroke-width="4" marker-end="url(#arrow-purple)"/>
<text x="445.56" y="299.00" font-size="15" fill="#76528f">lower-material mix</text>
<text x="445.56" y="319.00" font-size="15" fill="#76528f">EAE = 0.75</text>
<rect x="106" y="55" width="222" height="62" rx="10" fill="white" stroke="#24323d" stroke-width="2"/>
<text x="217" y="82" text-anchor="middle" font-size="16" fill="#24323d">same output commitment</text>
<text x="217" y="105" text-anchor="middle" font-size="18" font-weight="700" fill="#24323d">EE = 6/16 = 0.375</text>
<text x="454" y="146" font-size="15" fill="#176b73">feasible production plans</text>
</svg>
