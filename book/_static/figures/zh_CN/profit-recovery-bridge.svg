  <title id="title">方案 D 的利润改善桥接</title>
  <desc id="description">方案 D 获得利润七。一个可行的方向性经营标杆获得利润二十三，其中通过资源节约与服务扩张改善十六。利润最大化方案 B 获得利润二十七，剩余四归属于响应价格的投入—产出配置。堆叠条形图把总利润差距二十分为这两个组成部分。</desc>
