<?xml version="1.0" encoding="utf-8"?><!-- Generated from the English SVG by figures/localize_handbook_figures_zh.py; do not edit this file directly. --><svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-labelledby="title description">
  <title id="title">网络 SBM 的两种核心联结政策</title>
  <desc id="description">两幅图对比固定的实际交付量与可自由协调的交付量。两种政策都要求供应方与接收方的参照方案采用同一个相容目标。</desc>
  <defs>
    <marker id="nsbm-arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#d97732"/>
    </marker>
    <filter id="nsbm-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="580" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="42" font-size="23" font-weight="700" fill="#24323d">一项内部交付，两种核心治理问题</text>
    <text x="40" y="70" font-size="15" fill="#5c6b73">两种政策都保持供应方与接收方方案一致；差别在于管理层能否重新设计内部流量。</text>
    <g filter="url(#nsbm-shadow)">
      <rect x="40" y="104" width="486" height="354" rx="16" fill="#f7f9fa" stroke="#cfdadd"/>
      <rect x="554" y="104" width="486" height="354" rx="16" fill="#fffaf5" stroke="#e5b58f"/>
    </g>
    <text x="66" y="142" font-size="14" font-weight="700" fill="#5c6b73">固定联结 · 承接既有承诺</text>
    <text x="580" y="142" font-size="14" font-weight="700" fill="#d97732">自由联结 · 协同重新设计</text>
    <text x="66" y="174" font-size="14" fill="#24323d">两个部门都必须复现实际流量。</text>
    <text x="580" y="174" font-size="14" fill="#24323d">两个部门共同选择一个可行流量。</text>
    <g fill="#ffffff" stroke-width="1.5">
      <rect x="68" y="218" width="142" height="70" rx="10" stroke="#9fc8cb"/>
