    </g>
    <g font-size="12" font-weight="700">
      <text x="139" y="244" text-anchor="middle" fill="#176b73">供应方</text>
      <text x="427" y="244" text-anchor="middle" fill="#76528f">接收方</text>
      <text x="653" y="244" text-anchor="middle" fill="#176b73">供应方</text>
      <text x="941" y="244" text-anchor="middle" fill="#76528f">接收方</text>
    </g>
    <g font-size="13" fill="#24323d">
      <text x="139" y="272" text-anchor="middle">λ supplier</text>
      <text x="427" y="272" text-anchor="middle">λ recipient</text>
      <text x="653" y="272" text-anchor="middle">λ supplier</text>
      <text x="941" y="272" text-anchor="middle">λ recipient</text>
    </g>
    <g stroke="#d97732" stroke-width="4" marker-end="url(#nsbm-arrow)">
      <line x1="210" y1="253" x2="346" y2="253"/>
      <line x1="724" y1="253" x2="860" y2="253"/>
    </g>
    <g font-size="16" font-weight="700" fill="#24323d">
      <text x="283" y="334" text-anchor="middle">Zλ supplier = z observed = Zλ recipient</text>
      <text x="797" y="334" text-anchor="middle">Zλ supplier = Zλ recipient = z*</text>
    </g>
    <g font-size="13.5" fill="#5c6b73">
      <text x="283" y="374" text-anchor="middle">管理评价以既有数量为条件。</text>
      <text x="283" y="400" text-anchor="middle">共同目标不能偏离实际观察值。</text>
      <text x="797" y="374" text-anchor="middle">管理层可以共同重新设计该数量。</text>
      <text x="797" y="400" text-anchor="middle">两个过程仍不能选择不同目标。</text>
    </g>
    <rect x="40" y="488" width="1000" height="62" rx="13" fill="#24323d"/>
    <text x="540" y="515" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">一个组织，一个内部交付目标</text>
    <text x="540" y="538" text-anchor="middle" font-size="13.5" fill="#ffffff">固定联结保护实际承诺；自由联结揭示协同重新设计能够实现的机会。</text>
  </g>
