<?xml version="1.0" encoding="utf-8"?><!-- Generated from the English SVG by figures/localize_handbook_figures_zh.py; do not edit this file directly. --><svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-labelledby="title description">
<title id="title">一项已声明方案，四项标杆评价</title>
<desc id="description">一项统一的资源节约与服务扩张方案，为旧、新经营方案相对于旧、新生产机会的评价提供共同单位。四项方向性距离进入可加的 Luenberger 变化核算。</desc>
<defs>
<filter id="lp-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/></filter>
</defs>
<rect width="900" height="680" fill="#ffffff"/>
<g font-family="Arial, sans-serif">
<text x="34" y="38" font-size="24" font-weight="700" fill="#24323d">一项已声明方案，四项标杆评价</text>
<text x="34" y="66" font-size="15" fill="#5c6b73">在比较任一时期的方案之前，先固定变化的计量单位。</text>
<rect x="34" y="88" width="832" height="92" rx="14" fill="#24323d"/>
<text x="54" y="119" font-size="15" font-weight="700" fill="#ffffff">统一方案单位  g</text>
<rect x="285" y="103" width="232" height="38" rx="19" fill="#dceff0"/>
<text x="401" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#176b73">节约 g^x 单位资源</text>
<text x="539" y="129" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">+</text>
<rect x="560" y="103" width="280" height="38" rx="19" fill="#f8e8dc"/>
<text x="700" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#d97732">增加 g^y 单位服务</text>
<text x="450" y="163" text-anchor="middle" font-size="14" fill="#d7e2e5">四项评价采用同一实物单位。</text>
<text x="363" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#176b73">旧期生产机会  𝒯^t</text>
<text x="683" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#76528f">新期生产机会  𝒯^(t+1)</text>
<text x="42" y="279" font-size="15" font-weight="700" fill="#24323d">旧期方案  z^t</text>
<text x="42" y="405" font-size="15" font-weight="700" fill="#24323d">新期方案  z^(t+1)</text>
<rect x="205" y="238" width="316" height="100" rx="12" fill="#eef7f7" stroke="#176b73" filter="url(#lp-shadow)"/>
<text x="363" y="277" text-anchor="middle" font-size="21" font-weight="700" fill="#24323d">D^t(z^t; g)</text>
<text x="363" y="309" text-anchor="middle" font-size="14" fill="#5c6b73">本期方案单位缺口</text>
<rect x="545" y="238" width="316" height="100" rx="12" fill="#f3eef7" stroke="#76528f" filter="url(#lp-shadow)"/>
<text x="703" y="277" text-anchor="middle" font-size="21" font-weight="700" fill="#24323d">D^(t+1)(z^t; g)</text>
<text x="703" y="309" text-anchor="middle" font-size="14" fill="#5c6b73">新期机会下的旧期方案</text>
<rect x="205" y="364" width="316" height="100" rx="12" fill="#fff3e9" stroke="#d97732" filter="url(#lp-shadow)"/>
<text x="363" y="403" text-anchor="middle" font-size="21" font-weight="700" fill="#24323d">D^t(z^(t+1); g)</text>
<text x="363" y="435" text-anchor="middle" font-size="14" fill="#5c6b73">超出旧期机会时可能为负</text>
<rect x="545" y="364" width="316" height="100" rx="12" fill="#eef7f7" stroke="#176b73" filter="url(#lp-shadow)"/>
<text x="703" y="403" text-anchor="middle" font-size="21" font-weight="700" fill="#24323d">D^(t+1)(z^(t+1); g)</text>
<text x="703" y="435" text-anchor="middle" font-size="14" fill="#5c6b73">本期方案单位缺口</text>
<rect x="52" y="500" width="796" height="104" rx="14" fill="#f8fafb" stroke="#cfdadd"/>
<text x="76" y="530" font-size="14" font-weight="700" fill="#176b73">旧期标杆</text>
<text x="76" y="556" font-size="15" fill="#24323d">P^t = old plan's D^t - new plan's D^t</text>
<text x="488" y="530" font-size="14" font-weight="700" fill="#76528f">新期标杆</text>
<text x="488" y="556" font-size="15" fill="#24323d">P^(t+1) = D^(t+1)(old) - D^(t+1)(new)</text>
<text x="450" y="588" text-anchor="middle" font-size="20" font-weight="700" fill="#d97732">L = 1/2 [P^t + P^(t+1)] = EC_L + TC_L</text>
<rect x="34" y="624" width="832" height="38" rx="10" fill="#24323d"/>
<text x="450" y="649" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">该核算用于分配变化，并不能识别管理或技术原因。</text>
</g>
</svg>
