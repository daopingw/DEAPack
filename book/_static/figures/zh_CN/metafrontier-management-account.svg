<text x="123" y="241" text-anchor="start" font-size="24" font-weight="700" fill="#24323d">4</text>
<text x="252" y="284" text-anchor="start" font-size="24" font-weight="700" fill="#24323d">2</text>
<text x="95" y="370" text-anchor="start" font-size="15" font-weight="400" fill="#24323d">资源单位</text>
<text x="230" y="370" text-anchor="start" font-size="15" font-weight="400" fill="#24323d">服务</text>
<text x="85" y="404" text-anchor="start" font-size="14" font-weight="400" fill="#687780">组织实际交付的成果</text>
<rect x="450" y="130" width="300" height="300" rx="18" fill="#ffffff" stroke="#176b73" stroke-width="2"/>
<text x="480" y="172" text-anchor="start" font-size="21" font-weight="700" fill="#24323d">群组机会</text>
<text x="480" y="200" text-anchor="start" font-size="15" font-weight="400" fill="#687780">群组 1 内的最佳实践</text>
<line x1="480" y1="340" x2="720" y2="340" stroke="#e2e8f0"/>
<rect x="500" y="252" width="70" height="88" rx="6" fill="#d97732"/>
