<text x="518" y="241" text-anchor="start" font-size="24" font-weight="700" fill="#24323d">4</text>
<text x="647" y="240" text-anchor="start" font-size="24" font-weight="700" fill="#24323d">4</text>
<text x="490" y="370" text-anchor="start" font-size="15" font-weight="400" fill="#24323d">资源单位</text>
<text x="625" y="370" text-anchor="start" font-size="15" font-weight="400" fill="#24323d">服务</text>
<text x="480" y="404" text-anchor="start" font-size="15" font-weight="700" fill="#176b73">群组效率 = 2 ÷ 4 = 0.50</text>
<rect x="845" y="130" width="300" height="300" rx="18" fill="#ffffff" stroke="#356fa3" stroke-width="2"/>
<text x="875" y="172" text-anchor="start" font-size="21" font-weight="700" fill="#24323d">合并共同机会</text>
<text x="875" y="200" text-anchor="start" font-size="15" font-weight="400" fill="#687780">跨群组最佳实践</text>
