<text x="600" y="520" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">0.25 共同前沿效率 = 0.50 群组效率 × 0.50 MTR</text>
<text x="600" y="551" text-anchor="middle" font-size="15" font-weight="400" fill="#dbeafe">MTR 越大，表示越接近合并总体所表示的生产机会。</text>
<rect x="85" y="615" width="1030" height="68" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="115" y="645" text-anchor="start" font-size="15" font-weight="700" fill="#7c2d12">这是一项核算分解，而不是因果归属。</text>
<text x="115" y="668" text-anchor="start" font-size="15" font-weight="700" fill="#7c2d12">合并 VRS 标杆可能是跨群组观测形成的虚拟组合。</text>
