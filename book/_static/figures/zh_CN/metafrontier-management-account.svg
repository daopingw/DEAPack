<title id="title">径向共同前沿分解背后的管理账户</title>
<desc id="description">一个组织使用四单位资源提供两单位服务。其群组机会支持四单位服务，合并机会支持八单位服务，因此群组效率为二分之一，MTR 为二分之一，共同前沿效率为四分之一。</desc>
