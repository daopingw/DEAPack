<title id="title">DEAPack 自主设计的有符号示例：RDM 几何关系</title>
<desc id="description">三个合成观测定义一个产出导向的范围方向测度。被评价观测 F 的两个账户值为负二和一，逐坐标期望点为四和五；射线实现剩余机会向量的一半后，在 T 点到达 VRS 前沿。</desc>
