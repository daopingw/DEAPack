<text x="846" y="163" text-anchor="middle" font-size="15" font-weight="700" fill="#24323d">a₁</text>
<text x="922" y="163" text-anchor="middle" font-size="15" font-weight="700" fill="#24323d">a₂</text>
<line x1="676" y1="172" x2="944" y2="172" stroke="#dce5e7"/>
<text x="681" y="192" text-anchor="start" font-size="15" font-weight="400" fill="#24323d">被评价单元 F</text>
<text x="846" y="192" text-anchor="middle" font-size="15" font-weight="400" fill="#24323d">-2</text>
<text x="922" y="192" text-anchor="middle" font-size="15" font-weight="400" fill="#24323d">1</text>
<line x1="676" y1="202" x2="944" y2="202" stroke="#dce5e7"/>
<text x="681" y="222" text-anchor="start" font-size="15" font-weight="400" fill="#24323d">参照单元 North N</text>
<text x="846" y="222" text-anchor="middle" font-size="15" font-weight="400" fill="#24323d">-1</text>
<text x="922" y="222" text-anchor="middle" font-size="15" font-weight="400" fill="#24323d">5</text>
<line x1="676" y1="232" x2="944" y2="232" stroke="#dce5e7"/>
