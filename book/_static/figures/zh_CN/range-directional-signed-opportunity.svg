<text x="922" y="252" text-anchor="middle" font-size="15" font-weight="400" fill="#24323d">0</text>
<text x="678" y="292" text-anchor="start" font-size="15" font-weight="700" fill="#687780">F 的范围机会核算</text>
<text x="678" y="326" text-anchor="start" font-size="15" font-weight="700" fill="#24323d">I - F = (4 - (-2), 5 - 1) = (6, 4)</text>
<text x="678" y="358" text-anchor="start" font-size="15" font-weight="700" fill="#d97732">T = F + 1/2(I - F) = (1, 3)</text>
<text x="678" y="390" text-anchor="start" font-size="15" font-weight="700" fill="#176b73">T = 0.6N + 0.4E</text>
<rect x="676" y="414" width="268" height="48" rx="10" fill="#eee8f3" stroke="#cbb8d7"/>
<text x="810" y="444" text-anchor="middle" font-size="16" font-weight="700" fill="#76528f">RDM 效率 = 1 - β = 1/2</text>
<text x="678" y="489" text-anchor="start" font-size="15" font-weight="400" fill="#687780">β 表示共同可行份额，</text>
<text x="678" y="508" text-anchor="start" font-size="15" font-weight="400" fill="#687780">而不是任一有符号水平的百分比。</text>
