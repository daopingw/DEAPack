<?xml version="1.0" encoding="utf-8"?><!-- Generated from the English SVG by figures/localize_handbook_figures_zh.py; do not edit this file directly. --><svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title description">
<title id="title">Hicks–Moorsteen 全要素生产率核算</title>
<desc id="description">从 t 到 t+1 的 Hicks–Moorsteen 全要素生产率变化，等于双边产出数量指数与双边投入数量指数之比。每期技术分别提供一项产出与一项投入的数量比较。</desc>
<defs>
<filter id="hm-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/></filter>
</defs>
<rect width="900" height="650" fill="#ffffff"/>
<g font-family="Arial, sans-serif">
<text x="450" y="39" text-anchor="middle" font-size="24" font-weight="700" fill="#24323d">Hicks–Moorsteen 全要素生产率变化</text>
<rect x="38" y="66" width="824" height="94" rx="15" fill="#eef6f7" stroke="#176b73" stroke-width="2" filter="url(#hm-shadow)"/>
<text x="450" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#176b73">HM^(t,t+1) = output quantity index Q_y^(t,t+1) / input quantity index Q_x^(t,t+1)</text>
<text x="450" y="136" text-anchor="middle" font-size="15" fill="#40515c">产出数量增长快于投入数量增长时，生产率提高。</text>
<rect x="35" y="190" width="405" height="282" rx="16" fill="#f2f8f8" stroke="#176b73" stroke-width="2.5" filter="url(#hm-shadow)"/>
<text x="59" y="224" font-size="18" font-weight="700" fill="#176b73">基期视角：𝒯^t</text>
<text x="59" y="250" font-size="14" fill="#40515c">基期生产机会用于评价两个时期的数量组合。</text>
<rect x="59" y="272" width="357" height="76" rx="10" fill="#ffffff" stroke="#9cc8cc"/>
<text x="79" y="303" font-size="17" font-weight="700" fill="#176b73">产出数量，Q_y^t</text>
<text x="79" y="330" font-size="14" fill="#40515c">保持 x^t 不变；比较 y^t 与 y^(t+1)</text>
<rect x="59" y="365" width="357" height="76" rx="10" fill="#ffffff" stroke="#9cc8cc"/>
<text x="79" y="396" font-size="17" font-weight="700" fill="#176b73">投入数量，Q_x^t</text>
<text x="79" y="423" font-size="14" fill="#40515c">保持 y^t 不变；比较 x^t 与 x^(t+1)</text>
<rect x="460" y="190" width="405" height="282" rx="16" fill="#f5f1f8" stroke="#76528f" stroke-width="2.5" filter="url(#hm-shadow)"/>
<text x="484" y="224" font-size="16" font-weight="700" fill="#76528f">比较期视角：𝒯^(t+1)</text>
<text x="484" y="250" font-size="14" fill="#40515c">比较期生产机会提供第二项双边评价。</text>
<rect x="484" y="272" width="357" height="76" rx="10" fill="#ffffff" stroke="#c5b3d2"/>
<text x="504" y="303" font-size="17" font-weight="700" fill="#76528f">产出数量，Q_y^(t+1)</text>
<text x="504" y="330" font-size="14" fill="#40515c">保持 x^(t+1) 不变；比较产出组合</text>
<rect x="484" y="365" width="357" height="76" rx="10" fill="#ffffff" stroke="#c5b3d2"/>
<text x="504" y="396" font-size="17" font-weight="700" fill="#76528f">投入数量，Q_x^(t+1)</text>
<text x="504" y="423" font-size="14" fill="#40515c">保持 y^(t+1) 不变；比较投入组合</text>
<rect x="68" y="500" width="764" height="126" rx="16" fill="#fff7ef" stroke="#d97732" stroke-width="2" filter="url(#hm-shadow)"/>
<text x="450" y="532" text-anchor="middle" font-size="18" font-weight="700" fill="#9a4d17">对称综合两个时期的评价</text>
<text x="450" y="565" text-anchor="middle" font-size="15" fill="#24323d">Q_y^(t,t+1) = √(Q_y^t × Q_y^(t+1))</text>
<text x="450" y="591" text-anchor="middle" font-size="15" fill="#24323d">Q_x^(t,t+1) = √(Q_x^t × Q_x^(t+1))</text>
<text x="450" y="616" text-anchor="middle" font-size="16" font-weight="700" fill="#24323d">HM^(t,t+1) = Q_y^(t,t+1) / Q_x^(t,t+1)</text>
</g>
</svg>
