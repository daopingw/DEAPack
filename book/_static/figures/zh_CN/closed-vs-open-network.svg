    <marker id="flow-output" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#76528f"/>
    </marker>
    <filter id="open-shadow" x="-10%" y="-10%" width="120%" height="130%">
