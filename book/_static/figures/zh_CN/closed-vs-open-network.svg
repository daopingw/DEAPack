  <title id="title">封闭生产链与开放分支网络</title>
  <desc id="description">封闭链在第一过程之前接收全部外部资源，并在最后过程之后交付全部最终成果。开放网络允许资源从多个过程进入、成果从多个过程离开，内部联结则可以分支、汇合或跨越某个过程。</desc>
