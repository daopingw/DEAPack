    <text x="540" y="692" text-anchor="middle" font-size="13" fill="#5c6b73">价格把数量转化为价值；生产技术仍决定哪些替代方案可行。</text>
    <text x="540" y="712" text-anchor="middle" font-size="12" fill="#687780">这些条件性比较既不识别差距成因，也不规定实施路径。</text>
