    <text x="540" y="113" text-anchor="middle" font-size="18" font-weight="700" fill="#24323d">观测方案 D</text>
    <text x="540" y="142" text-anchor="middle" font-size="16" fill="#24323d">资源 x = 6 · 服务 y = (3, 2)</text>
    <text x="540" y="170" text-anchor="middle" font-size="16" fill="#24323d">成本 = 12 · 收益 = 19 · 利润 = 7</text>
    <text x="540" y="203" text-anchor="middle" font-size="14" fill="#5c6b73">哪种机会重要，取决于决策问题。</text>

