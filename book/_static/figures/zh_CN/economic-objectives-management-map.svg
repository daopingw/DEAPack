<?xml version="1.0" encoding="utf-8"?><!-- Generated from the English SVG by figures/localize_handbook_figures_zh.py; do not edit this file directly. --><svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-labelledby="title description">
  <title id="title">同一经营方案、三项核心价格决策与一项方向性桥接</title>
  <desc id="description">观测方案 D 使用六单位资源提供三单位普通服务和二单位优质服务。最低成本比较保护其服务承诺，最大收益比较保护其资源能力，最大利润比较则联合选择投入与产出。这三项核心决定构成主要卡片；较小的次要方向性桥接随后相对于利润差距，为一项已声明改进方案赋值。所有核算均采用同一个四方案 VRS 技术。</desc>
  <defs>
    <marker id="arrow-economic-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#176b73"/></marker>
    <marker id="arrow-economic-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97732"/></marker>
    <marker id="arrow-economic-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#76528f"/></marker>
    <filter id="shadow-economic" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/></filter>
