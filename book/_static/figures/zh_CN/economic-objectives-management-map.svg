    <text x="250" y="625" font-size="15" font-weight="700" fill="#66427c">方向性目标 T：x̂ = 4.4 · ŷ = (4.6, 3.6) · T 点利润 = 23</text>
    <text x="250" y="647" font-size="14" fill="#24323d">利润改善 = 16 技术部分 + 4 配置部分 · ν = 10</text>
