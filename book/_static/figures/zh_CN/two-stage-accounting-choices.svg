    </g>
    <text x="175" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#176b73">过程 1</text>
    <text x="175" y="166" text-anchor="middle" font-size="19" font-weight="700" fill="#176b73">研究</text>
    <text x="540" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#d97732">内部交付</text>
    <text x="540" y="166" text-anchor="middle" font-size="19" font-weight="700" fill="#d97732">创新成果 z</text>
    <text x="905" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#76528f">过程 2</text>
    <text x="905" y="166" text-anchor="middle" font-size="19" font-weight="700" fill="#76528f">商业化</text>
    <line x1="290" y1="146" x2="415" y2="146" stroke="#176b73" stroke-width="3" marker-end="url(#choice-arrow)"/>
    <line x1="655" y1="146" x2="780" y2="146" stroke="#176b73" stroke-width="3" marker-end="url(#choice-arrow)"/>
    <text x="540" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#5c6b73">过程图与交付相同 · 报告问题不同</text>
    <g filter="url(#choice-shadow)">
      <rect x="30" y="250" width="320" height="300" rx="14" fill="#eef7f7" stroke="#9fc8cb"/>
      <rect x="380" y="250" width="320" height="300" rx="14" fill="#fff7ef" stroke="#e5b58f"/>
      <rect x="730" y="250" width="320" height="300" rx="14" fill="#f3eef7" stroke="#c6b2d3"/>
    </g>
    <text x="54" y="284" font-size="13" font-weight="700" fill="#176b73">仅报告系统的径向账户</text>
    <text x="54" y="326" font-size="27" font-weight="700" fill="#24323d">E</text>
    <text x="54" y="362" font-size="15" fill="#24323d">一项协调方案需要</text>
    <text x="54" y="386" font-size="15" fill="#24323d">多少外部资源？</text>
    <rect x="54" y="418" width="272" height="94" rx="9" fill="#ffffff" stroke="#cfe0e2"/>
    <text x="190" y="445" text-anchor="middle" font-size="13" font-weight="700" fill="#176b73">董事会层面报告</text>
    <text x="190" y="473" text-anchor="middle" font-size="14" fill="#24323d">各过程特有的参照单元</text>
    <text x="190" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#5c6b73">不报告过程效率值</text>

    <text x="404" y="284" font-size="13" font-weight="700" fill="#a65119">关系乘积型</text>
    <text x="404" y="326" font-size="27" font-weight="700" fill="#24323d">E = E₁ × E₂</text>
    <text x="404" y="362" font-size="15" fill="#24323d">相互依赖的过程比率</text>
    <text x="404" y="386" font-size="15" fill="#24323d">如何共同形成系统绩效？</text>
    <rect x="404" y="418" width="272" height="94" rx="9" fill="#ffffff" stroke="#ead0b9"/>
    <text x="540" y="445" text-anchor="middle" font-size="13" font-weight="700" fill="#a65119">共享联结估值</text>
    <text x="540" y="473" text-anchor="middle" font-size="14" fill="#24323d">所选过程比率</text>
    <text x="540" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#5c6b73">不是转移价格</text>

    <text x="754" y="284" font-size="13" font-weight="700" fill="#76528f">加性过程归属</text>
    <text x="754" y="326" font-size="27" font-weight="700" fill="#24323d">E = α₁E₁ + α₂E₂</text>
    <text x="754" y="362" font-size="15" fill="#24323d">如何把系统绩效</text>
    <text x="754" y="386" font-size="15" fill="#24323d">归入各过程？</text>
    <rect x="754" y="418" width="272" height="94" rx="9" fill="#ffffff" stroke="#d9cde2"/>
    <text x="890" y="445" text-anchor="middle" font-size="13" font-weight="700" fill="#76528f">拟合资源份额</text>
    <text x="890" y="473" text-anchor="middle" font-size="14" fill="#24323d">算术归属</text>
    <text x="890" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#5c6b73">不是预算或优先级</text>

    <rect x="40" y="582" width="1000" height="60" rx="12" fill="#24323d"/>
    <text x="540" y="607" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">同一联结只存储一次，并在两个端点协调。</text>
    <text x="540" y="629" text-anchor="middle" font-size="13" fill="#d7e2e5">不同账户未必产生可比效率值、唯一过程解释或因果结论。</text>
    <text x="540" y="671" text-anchor="middle" font-size="13" fill="#687780">应根据决策问题选择账户，而不是选择效率值最高的账户。</text>
