<?xml version="1.0" encoding="utf-8"?><!-- Generated from the English SVG by figures/localize_handbook_figures_zh.py; do not edit this file directly. --><svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-labelledby="title description">
  <title id="title">一个联结组织的三种绩效账户</title>
  <desc id="description">同一条研究—商业化过程链可以支持仅报告系统的径向账户、关系乘积账户或基于内生份额的加性过程归属。三份报告协调同一项内部交付，却回答不同的管理问题。</desc>
  <defs>
    <marker id="choice-arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#176b73"/>
    </marker>
    <filter id="choice-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="690" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="42" font-size="23" font-weight="700" fill="#24323d">同一条组织过程链可以支持不同绩效账户</text>
    <text x="40" y="70" font-size="15" fill="#5c6b73">过程图说明工作如何组织；绩效报告制度说明董事会希望了解什么。</text>
    <g filter="url(#choice-shadow)">
