<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title description">
  <title id="title">Multi-period aggregative appraisal compared with dynamic production</title>
  <desc id="description">The left panel shows two contemporaneous period technologies joined only by one common performance requirement. The right panel shows operating plans joined by a state or carry-over balance. The first is Park and Park multi-period aggregation; the second is dynamic production.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#3975a6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#237a57"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1120" height="720" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="42" y="44" font-size="25" font-weight="700" fill="#24323d">Two ways to put several periods into one performance study</text>
    <text x="42" y="73" font-size="17" fill="#5c6b73">A shared rating rule does not create an economic connection between periods.</text>

    <rect x="42" y="105" width="500" height="548" rx="20" fill="#f5f9fc" stroke="#a8c4dc" stroke-width="2"/>
    <rect x="578" y="105" width="500" height="548" rx="20" fill="#f4faf6" stroke="#9fc9b2" stroke-width="2"/>

    <text x="66" y="140" font-size="16" font-weight="700" fill="#3975a6">PARK–PARK MULTI-PERIOD AGGREGATION</text>
    <text x="602" y="140" font-size="16" font-weight="700" fill="#237a57">DYNAMIC PRODUCTION</text>

    <text x="66" y="170" font-size="16" fill="#42545e">One review of several completed operating records</text>
    <text x="602" y="170" font-size="16" fill="#42545e">One operating history connected through time</text>

    <g filter="url(#shadow)">
      <rect x="82" y="211" width="420" height="116" rx="14" fill="#ffffff" stroke="#b9cfdc"/>
      <rect x="82" y="366" width="420" height="116" rx="14" fill="#ffffff" stroke="#b9cfdc"/>
      <rect x="618" y="211" width="180" height="160" rx="14" fill="#ffffff" stroke="#afd2bc"/>
      <rect x="858" y="211" width="180" height="160" rx="14" fill="#ffffff" stroke="#afd2bc"/>
    </g>

    <text x="104" y="238" font-size="18" font-weight="700" fill="#24323d">Period 1 scorecard</text>
    <text x="104" y="270" font-size="15" fill="#5c6b73">resources → contemporaneous services</text>
    <text x="104" y="297" font-size="15" fill="#3975a6">peer plan λ¹ from period-1 organizations</text>
    <rect x="390" y="242" width="88" height="55" rx="10" fill="#e9f2f8" stroke="#8fb4cc"/>
    <text x="434" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#3975a6">same radial</text>
    <text x="434" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#24323d">factor</text>

    <text x="104" y="393" font-size="18" font-weight="700" fill="#24323d">Period 2 scorecard</text>
    <text x="104" y="425" font-size="15" fill="#5c6b73">resources → contemporaneous services</text>
    <text x="104" y="452" font-size="15" fill="#3975a6">peer plan λ² from period-2 organizations</text>
    <rect x="390" y="397" width="88" height="55" rx="10" fill="#e9f2f8" stroke="#8fb4cc"/>
    <text x="434" y="419" text-anchor="middle" font-size="13" font-weight="700" fill="#3975a6">same radial</text>
    <text x="434" y="439" text-anchor="middle" font-size="16" font-weight="700" fill="#24323d">factor</text>

    <path d="M64 202 H54 V491 H64" fill="none" stroke="#3975a6" stroke-width="4"/>
    <text x="54" y="516" text-anchor="middle" font-size="14" font-weight="700" fill="#3975a6" transform="rotate(-90 54 516)">JOINT APPRAISAL</text>

    <rect x="82" y="523" width="420" height="82" rx="13" fill="#24323d"/>
    <text x="292" y="551" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">ONE HORIZON RATING</text>
    <text x="292" y="576" text-anchor="middle" font-size="14.5" fill="#d9e5ea">No stock, carry-over, transition, or productivity change</text>
    <text x="292" y="596" text-anchor="middle" font-size="14.5" fill="#d9e5ea">is inferred from the common rating.</text>

    <text x="708" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#24323d">Period 1 plan</text>
    <text x="708" y="274" text-anchor="middle" font-size="15" fill="#5c6b73">resources</text>
    <line x1="660" y1="292" x2="756" y2="292" stroke="#3975a6" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <text x="708" y="322" text-anchor="middle" font-size="15" fill="#5c6b73">services</text>
    <text x="708" y="349" text-anchor="middle" font-size="13.5" fill="#237a57">peer plan λ¹</text>

    <text x="948" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#24323d">Period 2 plan</text>
    <text x="948" y="274" text-anchor="middle" font-size="15" fill="#5c6b73">resources</text>
    <line x1="900" y1="292" x2="996" y2="292" stroke="#3975a6" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <text x="948" y="322" text-anchor="middle" font-size="15" fill="#5c6b73">services</text>
    <text x="948" y="349" text-anchor="middle" font-size="13.5" fill="#237a57">peer plan λ²</text>

    <line x1="800" y1="291" x2="850" y2="291" stroke="#237a57" stroke-width="6" marker-end="url(#arrow-green)"/>
    <rect x="776" y="391" width="104" height="54" rx="10" fill="#eaf5ee" stroke="#87bd9d"/>
    <text x="828" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#237a57">state / stock</text>
    <text x="828" y="434" text-anchor="middle" font-size="14" fill="#4f655a">balance</text>
    <path d="M828 391 C828 350 828 333 828 309" fill="none" stroke="#237a57" stroke-width="2.5"/>

    <rect x="618" y="480" width="420" height="125" rx="13" fill="#24323d"/>
    <text x="828" y="510" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">ONE JOINTLY FEASIBLE TRAJECTORY</text>
    <text x="828" y="538" text-anchor="middle" font-size="14.5" fill="#dce8e0">What period 1 leaves behind changes what period 2 can do.</text>
    <text x="828" y="566" text-anchor="middle" font-size="14.5" fill="#dce8e0">Carry-over, investment, backlog, or another transition</text>
    <text x="828" y="587" text-anchor="middle" font-size="14.5" fill="#dce8e0">must be part of the production technology.</text>

    <text x="560" y="684" text-anchor="middle" font-size="16" font-weight="700" fill="#8c642f">Same number of periods · different managerial question · different model identity</text>
  </g>
</svg>
