<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="title description">
  <title id="title">Plan D profit-recovery bridge</title>
  <desc id="description">Plan D earns profit seven. A feasible directional operating benchmark earns twenty-three, recovering sixteen through resource saving and service expansion. The profit-maximizing Plan B earns twenty-seven, leaving four attributable to the price-responsive input-output allocation. A stacked bar divides the total profit gap of twenty into those two components.</desc>
  <defs>
    <filter id="shadow-profit" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1080" height="680" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="50" y="40" font-size="21" font-weight="700" fill="#24323d">Where Plan D leaves 20 profit units unrealized</text>
    <text x="50" y="68" font-size="15" fill="#5c6b73">VRS technology · input price w = 2 · output prices p₁ = 3 and p₂ = 5</text>

    <g filter="url(#shadow-profit)">
      <rect x="42" y="102" width="300" height="292" rx="12" fill="#f5f7f8" stroke="#cbd5d9"/>
      <rect x="390" y="102" width="300" height="292" rx="12" fill="#fff7ef" stroke="#e4a46f"/>
      <rect x="738" y="102" width="300" height="292" rx="12" fill="#f7f1fa" stroke="#a98abb"/>
    </g>

    <rect x="42" y="102" width="300" height="58" rx="12" fill="#e9eef0"/>
    <rect x="390" y="102" width="300" height="58" rx="12" fill="#f8e8dc"/>
    <rect x="738" y="102" width="300" height="58" rx="12" fill="#eee4f3"/>
    <rect x="42" y="146" width="300" height="14" fill="#e9eef0"/>
    <rect x="390" y="146" width="300" height="14" fill="#f8e8dc"/>
    <rect x="738" y="146" width="300" height="14" fill="#eee4f3"/>

    <text x="64" y="137" font-size="19" font-weight="700" fill="#24323d">Current Plan D</text>
    <text x="412" y="137" font-size="19" font-weight="700" fill="#a65119">Operating benchmark T</text>
    <text x="760" y="137" font-size="19" font-weight="700" fill="#66427c">Profit-maximizing Plan B</text>

    <g font-size="16" fill="#24323d">
      <text x="64" y="193">Resource input: 6.0</text>
      <text x="64" y="220">Standard service: 3.0</text>
      <text x="64" y="247">Premium service: 2.0</text>
      <text x="64" y="286">Revenue: 19.0</text>
      <text x="64" y="313">Cost: 12.0</text>

      <text x="412" y="193">Resource input: 4.4</text>
      <text x="412" y="220">Standard service: 4.6</text>
      <text x="412" y="247">Premium service: 3.6</text>
      <text x="412" y="286">Revenue: 31.8</text>
      <text x="412" y="313">Cost: 8.8</text>

      <text x="760" y="193">Resource input: 5.0</text>
      <text x="760" y="220">Standard service: 4.0</text>
      <text x="760" y="247">Premium service: 5.0</text>
      <text x="760" y="286">Revenue: 37.0</text>
      <text x="760" y="313">Cost: 10.0</text>
    </g>

    <text x="64" y="365" font-size="25" font-weight="700" fill="#24323d">Profit = 7</text>
    <text x="412" y="365" font-size="25" font-weight="700" fill="#a65119">Profit = 23</text>
    <text x="760" y="365" font-size="25" font-weight="700" fill="#66427c">Profit = 27</text>

    <text x="50" y="433" font-size="14" font-weight="700" fill="#5c6b73">ACCOUNTING BRIDGE — NOT A REQUIRED IMPLEMENTATION SEQUENCE</text>
    <line x1="190" y1="473" x2="540" y2="473" stroke="#d97732" stroke-width="7" stroke-linecap="round"/>
    <line x1="540" y1="473" x2="888" y2="473" stroke="#76528f" stroke-width="7" stroke-linecap="round"/>
    <circle cx="190" cy="473" r="10" fill="#24323d" stroke="#ffffff" stroke-width="3"/>
    <circle cx="540" cy="473" r="10" fill="#d97732" stroke="#ffffff" stroke-width="3"/>
    <circle cx="888" cy="473" r="10" fill="#76528f" stroke="#ffffff" stroke-width="3"/>
    <text x="365" y="458" text-anchor="middle" font-size="16" font-weight="700" fill="#a65119">+16 operating recovery</text>
    <text x="714" y="458" text-anchor="middle" font-size="16" font-weight="700" fill="#66427c">+4 allocation recovery</text>
    <text x="190" y="503" text-anchor="middle" font-size="14" fill="#24323d">7</text>
    <text x="540" y="503" text-anchor="middle" font-size="14" fill="#a65119">23</text>
    <text x="888" y="503" text-anchor="middle" font-size="14" fill="#66427c">27</text>

    <text x="50" y="548" font-size="17" font-weight="700" fill="#24323d">Total attainable profit recovery = 20</text>
    <rect x="50" y="565" width="784" height="54" rx="8" fill="#d97732"/>
    <path d="M834 565 H1022 Q1030 565 1030 573 V611 Q1030 619 1022 619 H834 Z" fill="#76528f"/>
    <text x="442" y="598" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">16 technical · 80%</text>
    <text x="932" y="598" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">4 allocative · 20%</text>
    <text x="50" y="652" font-size="14" fill="#5c6b73">One declared improvement package is worth 10 · Nerlovian profit inefficiency = 2.0 = 1.6 + 0.4</text>
  </g>
</svg>
