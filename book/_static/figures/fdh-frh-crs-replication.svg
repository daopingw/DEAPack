<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
<title id="title">From observed units to whole-module replication and divisible activity</title>
<desc id="description">The same observed branch templates support one observed unit under FDH, whole-number copies and combinations under FRH, and fractional activity shares under continuously divisible CRS DEA.</desc>
