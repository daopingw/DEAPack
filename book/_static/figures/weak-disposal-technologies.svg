<svg xmlns="http://www.w3.org/2000/svg" width="600" height="960" viewBox="0 0 600 960" role="img" aria-labelledby="title description">
<title id="title">Three distinct bad-output formulations</title>
<desc id="description">A bad-output equality alone leaves scale and convexity unspecified. A common-factor CRS account uses one retention rate, while an activity-specific VRS account permits reference-specific rates.</desc>
<rect width="600" height="960" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="24" y="30" width="552" height="270" rx="16" fill="#f2f4f5" stroke="#8d9aa0" stroke-width="2"/>
<text x="48" y="70" text-anchor="start" font-size="23" font-weight="700" fill="#24323d">Equality only</text>
<rect x="24" y="330" width="552" height="270" rx="16" fill="#e9f4f5" stroke="#176b73" stroke-width="2"/>
<text x="48" y="370" text-anchor="start" font-size="23" font-weight="700" fill="#24323d">Common factor (CRS)</text>
<rect x="24" y="630" width="552" height="300" rx="16" fill="#f2edf6" stroke="#76528f" stroke-width="2"/>
<text x="48" y="670" text-anchor="start" font-size="23" font-weight="700" fill="#24323d">Activity-specific (VRS)</text>
<rect x="48" y="94" width="190" height="72" rx="10" fill="#ffffff" stroke="#8d9aa0" stroke-width="2"/>
<text x="143" y="120" text-anchor="middle" font-size="16" font-weight="400" fill="#24323d">Bad-output account</text>
<text x="143" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#24323d">Bλ = b̂</text>
<line x1="255" y1="130" x2="328" y2="130" stroke="#8d9aa0" stroke-width="3" stroke-dasharray="7 6"/>
<circle cx="374" cy="130" r="31" fill="#d97732"/>
<text x="374" y="141" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">?</text>
<text x="48" y="207" text-anchor="start" font-size="17" font-weight="400" fill="#24323d">Scale and convexity are still unspecified.</text>
<text x="48" y="235" text-anchor="start" font-size="17" font-weight="400" fill="#24323d">Equality does not, by itself, identify a named</text>
<text x="48" y="263" text-anchor="start" font-size="17" font-weight="400" fill="#24323d">weak-disposal technology.</text>
<rect x="48" y="395" width="95" height="75" rx="8" fill="#ffffff" stroke="#176b73" stroke-width="2"/>
<text x="95" y="423" text-anchor="middle" font-size="16" font-weight="700" fill="#24323d">Plant A</text>
<rect x="69" y="440" width="53" height="16" rx="4" fill="#176b73"/>
<rect x="158" y="395" width="95" height="75" rx="8" fill="#ffffff" stroke="#176b73" stroke-width="2"/>
<text x="205" y="423" text-anchor="middle" font-size="16" font-weight="700" fill="#24323d">Plant B</text>
<rect x="179" y="440" width="53" height="16" rx="4" fill="#176b73"/>
<rect x="268" y="395" width="95" height="75" rx="8" fill="#ffffff" stroke="#176b73" stroke-width="2"/>
<text x="315" y="423" text-anchor="middle" font-size="16" font-weight="700" fill="#24323d">Plant C</text>
<rect x="289" y="440" width="53" height="16" rx="4" fill="#176b73"/>
<rect x="429" y="394" width="123" height="77" rx="10" fill="#176b73"/>
<text x="490" y="421" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">one retention</text>
<text x="490" y="447" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">rate r</text>
<text x="48" y="515" text-anchor="start" font-size="17" font-weight="400" fill="#24323d">Every represented activity is retained at</text>
<text x="48" y="543" text-anchor="start" font-size="17" font-weight="400" fill="#24323d">the same rate within the CRS portfolio.</text>
<text x="48" y="574" text-anchor="start" font-size="16" font-weight="400" fill="#176b73">The linear source identity relies on CRS.</text>
<rect x="48" y="695" width="95" height="103" rx="8" fill="#ffffff" stroke="#76528f" stroke-width="2"/>
<text x="95" y="723" text-anchor="middle" font-size="16" font-weight="700" fill="#24323d">Plant A</text>
<rect x="69" y="740" width="53" height="25" rx="4" fill="#76528f"/>
<text x="95" y="787" text-anchor="middle" font-size="13" font-weight="400" fill="#24323d">retention = .9</text>
<rect x="158" y="695" width="95" height="103" rx="8" fill="#ffffff" stroke="#76528f" stroke-width="2"/>
<text x="205" y="723" text-anchor="middle" font-size="16" font-weight="700" fill="#24323d">Plant B</text>
<rect x="179" y="746" width="53" height="19" rx="4" fill="#76528f"/>
<text x="205" y="787" text-anchor="middle" font-size="13" font-weight="400" fill="#24323d">retention = .5</text>
<rect x="268" y="695" width="95" height="103" rx="8" fill="#ffffff" stroke="#76528f" stroke-width="2"/>
<text x="315" y="723" text-anchor="middle" font-size="16" font-weight="700" fill="#24323d">Plant C</text>
<rect x="289" y="746" width="53" height="19" rx="4" fill="#76528f"/>
<text x="315" y="787" text-anchor="middle" font-size="13" font-weight="400" fill="#24323d">retention = .7</text>
<rect x="429" y="701" width="123" height="90" rx="10" fill="#76528f"/>
<text x="490" y="729" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">different</text>
<text x="490" y="754" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">retention rates</text>
<text x="490" y="779" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">rj</text>
<text x="48" y="840" text-anchor="start" font-size="17" font-weight="400" fill="#24323d">Reference activities may carry different</text>
<text x="48" y="868" text-anchor="start" font-size="17" font-weight="400" fill="#24323d">rates inside one VRS convex portfolio.</text>
<text x="48" y="901" text-anchor="start" font-size="16" font-weight="400" fill="#76528f">The convex linearization retains VRS.</text>
</g>
</svg>
