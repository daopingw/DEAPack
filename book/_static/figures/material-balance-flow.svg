<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
<title id="title">Material balance and efficiency decomposition</title>
<desc id="description">Material inflow splits into material retained in desirable output and residual material, while environmental efficiency decomposes into technical and environmental allocative efficiency.</desc>
<defs>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#176b73"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97732"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#76528f"/></marker>
<marker id="axis-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#24323d"/></marker>
</defs>
<rect width="760" height="500" fill="white"/>
<rect x="65" y="112" width="180" height="86" rx="12" fill="#f8e8dc" stroke="#d97732" stroke-width="3"/>
<text x="155" y="151" text-anchor="middle" font-size="20" fill="#24323d">inflow</text>
<text x="155" y="181" text-anchor="middle" font-size="24" font-weight="700" fill="#d97732">a&#8242;x</text>
<line x1="245" y1="155" x2="340" y2="155" stroke="#24323d" stroke-width="4" marker-end="url(#axis-arrow)"/>
<circle cx="370" cy="155" r="14" fill="#24323d"/>
<line x1="382" y1="147" x2="478" y2="95" stroke="#176b73" stroke-width="4" marker-end="url(#arrow-teal)"/>
<line x1="382" y1="163" x2="478" y2="222" stroke="#76528f" stroke-width="4" marker-end="url(#arrow-purple)"/>
<rect x="492" y="54" width="200" height="82" rx="12" fill="#dceff0" stroke="#176b73" stroke-width="3"/>
<text x="592" y="87" text-anchor="middle" font-size="18" fill="#24323d">retained</text>
<text x="592" y="117" text-anchor="middle" font-size="24" font-weight="700" fill="#176b73">c&#8242;y</text>
<rect x="492" y="192" width="200" height="82" rx="12" fill="#eee8f3" stroke="#76528f" stroke-width="3"/>
<text x="592" y="225" text-anchor="middle" font-size="18" fill="#24323d">residual</text>
<text x="592" y="255" text-anchor="middle" font-size="24" font-weight="700" fill="#76528f">z</text>
<rect x="180" y="310" width="400" height="66" rx="12" fill="white" stroke="#24323d" stroke-width="2"/>
<text x="380" y="352" text-anchor="middle" font-size="26" font-weight="600" fill="#24323d">a&#8242;x = c&#8242;y + z</text>
<line x1="380" y1="377" x2="380" y2="410" stroke="#d97732" stroke-width="3" marker-end="url(#arrow-orange)"/>
<text x="380" y="456" text-anchor="middle" font-size="25" font-weight="700" fill="#d97732">EE = TE &#215; EAE</text>
</svg>
