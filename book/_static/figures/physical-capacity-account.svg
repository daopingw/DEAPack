<text x="380" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#d97732">MAY ADJUST · STAFF HOURS</text>
<rect x="514" y="82" width="184" height="34" rx="17" fill="#eee8f3" stroke="#76528f"/>
<text x="606" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#76528f">SERVICE · VISITS</text>
<text x="62" y="146" font-size="15" font-weight="700" fill="#24323d">Observed service</text>
<text x="62" y="165" font-size="11.5" fill="#687780">what the clinic delivered</text>
<rect x="250" y="129" width="480" height="31" rx="7" fill="#dce5e7" opacity="0.58"/>
<rect x="250" y="129" width="240" height="31" rx="7" fill="#d97732" opacity="0.88"/>
<text x="477" y="151" text-anchor="end" font-size="17" font-weight="700" fill="white">100</text>
<text x="62" y="238" font-size="15" font-weight="700" fill="#24323d">Current-input potential</text>
<text x="62" y="257" font-size="11.5" fill="#687780">better use of beds and current staff hours</text>
<rect x="250" y="221" width="480" height="31" rx="7" fill="#dce5e7" opacity="0.58"/>
<rect x="250" y="221" width="360" height="31" rx="7" fill="#176b73" opacity="0.88"/>
<text x="597" y="243" text-anchor="end" font-size="17" font-weight="700" fill="white">150</text>
<text x="62" y="330" font-size="15" font-weight="700" fill="#24323d">Physical capacity</text>
<text x="62" y="349" font-size="11.5" fill="#687780">installed beds, with staff hours allowed to adjust</text>
