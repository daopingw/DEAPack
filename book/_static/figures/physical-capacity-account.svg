<rect x="250" y="313" width="480" height="31" rx="7" fill="#76528f" opacity="0.88"/>
<text x="717" y="335" text-anchor="end" font-size="17" font-weight="700" fill="white">200</text>
<path d="M 490 166 L 490 181 L 610 181 L 610 166" fill="none" stroke="#176b73" stroke-width="2"/>
<text x="550" y="198" text-anchor="middle" font-size="11.5" font-weight="700" fill="#176b73">50 visits · operating</text>
<text x="550" y="213" text-anchor="middle" font-size="11.5" font-weight="700" fill="#176b73">performance headroom</text>
<path d="M 610 258 L 610 273 L 730 273 L 730 258" fill="none" stroke="#76528f" stroke-width="2"/>
<text x="670" y="290" text-anchor="middle" font-size="11.5" font-weight="700" fill="#76528f">50 visits · additional use</text>
<text x="670" y="305" text-anchor="middle" font-size="11.5" font-weight="700" fill="#76528f">of installed beds</text>
<rect x="58" y="365" width="644" height="65" rx="14" fill="#f7fafb" stroke="#c8d8db" stroke-width="1.5"/>
<text x="380" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#24323d">ONE AUDITABLE IDENTITY</text>
<text x="380" y="416" text-anchor="middle" font-size="17" font-weight="700" fill="#24323d">Observed utilization 50% = technical efficiency 66.7% &#215; adjusted utilization 75%</text>
