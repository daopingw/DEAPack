<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title description">
  <title id="title">Scale assumptions change the performance benchmark</title>
  <desc id="description">For DMU 1, every alpha setting has the same CRS score of 0.636. Under VRS, scores and comparator mixes differ because observed operating scale cannot be freely replicated.</desc>
  <defs>
    <filter id="shadow-gdf-scale" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="650" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="44" y="42" font-size="23" font-weight="700" fill="#24323d">Scale policy determines whether &#945; changes the score</text>
    <text x="44" y="70" font-size="15" fill="#5c6b73">DMU 1 in the five-unit example · three declared adjustment paths</text>
    <g filter="url(#shadow-gdf-scale)">
      <rect x="44" y="104" width="300" height="438" rx="12" fill="#eef7f7" stroke="#b7d7d9"/>
      <rect x="372" y="104" width="664" height="438" rx="12" fill="#f8fafb" stroke="#d5dee2"/>
    </g>
    <text x="68" y="142" font-size="20" font-weight="700" fill="#176b73">CRS · scale can adjust</text>
    <text x="396" y="142" font-size="20" font-weight="700" fill="#76528f">VRS · observed scale is binding</text>
    <text x="68" y="181" font-size="14" fill="#5c6b73">One total productivity gap.</text>
    <text x="68" y="202" font-size="14" fill="#5c6b73">Three operating counterfactuals.</text>
    <rect x="68" y="220" width="252" height="110" rx="10" fill="#176b73"/>
    <text x="194" y="259" text-anchor="middle" font-size="15" font-weight="700" fill="#dceff0">ALL THREE &#945; SETTINGS</text>
    <text x="194" y="300" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">δ = 0.636</text>
    <text x="68" y="375" font-size="15" fill="#24323d">&#945; divides the measured adjustment</text>
    <text x="68" y="397" font-size="15" fill="#24323d">between resources and services.</text>
    <text x="68" y="432" font-size="15" fill="#24323d">CRS total productivity efficiency</text>
    <text x="68" y="454" font-size="15" fill="#24323d">does not change.</text>
    <text x="396" y="181" font-size="14" fill="#5c6b73">The path changes the diagnosed gap</text>
    <text x="396" y="202" font-size="14" fill="#5c6b73">and the feasible peer mix.</text>
    <text x="396" y="220" font-size="12" font-weight="700" fill="#5c6b73">ADJUSTMENT PATH</text>
    <text x="680" y="220" font-size="12" font-weight="700" fill="#5c6b73">VRS SCORE</text>
    <text x="796" y="220" font-size="12" font-weight="700" fill="#5c6b73">COMPARATOR MIX</text>
    <rect x="396" y="242" width="616" height="76" rx="8" fill="#ffffff" stroke="#e0e7e9"/>
    <text x="414" y="267" font-size="18" font-weight="700" fill="#76528f">&#945; = 0</text>
    <text x="414" y="293" font-size="14" fill="#24323d">Hold services fixed</text>
    <text x="722" y="287" text-anchor="middle" font-size="23" font-weight="700" fill="#76528f">0.750</text>
    <text x="804" y="285" font-size="14" fill="#24323d">12.50% DMU 2 + 87.50% DMU 3</text>
    <rect x="396" y="334" width="616" height="76" rx="8" fill="#f2f5f6" stroke="#e0e7e9"/>
    <text x="414" y="359" font-size="18" font-weight="700" fill="#76528f">&#945; = 0.5</text>
    <text x="414" y="385" font-size="14" fill="#24323d">Assess both margins</text>
    <text x="722" y="379" text-anchor="middle" font-size="23" font-weight="700" fill="#76528f">0.682</text>
    <text x="804" y="377" font-size="14" fill="#24323d">23.86% DMU 2 + 76.14% DMU 3</text>
    <rect x="396" y="426" width="616" height="76" rx="8" fill="#ffffff" stroke="#e0e7e9"/>
    <text x="414" y="451" font-size="18" font-weight="700" fill="#76528f">&#945; = 1</text>
    <text x="414" y="477" font-size="14" fill="#24323d">Hold resources fixed</text>
    <text x="722" y="471" text-anchor="middle" font-size="23" font-weight="700" fill="#76528f">0.778</text>
    <text x="804" y="469" font-size="14" fill="#24323d">50.00% DMU 2 + 50.00% DMU 3</text>
    <rect x="44" y="575" width="992" height="42" rx="9" fill="#24323d"/>
    <text x="540" y="601" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">A score is meaningful only after the scale policy and improvement contract are declared.</text>
  </g>
</svg>
