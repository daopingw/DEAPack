<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title description">
  <title id="title">Three operating counterfactuals for one productivity gap</title>
  <desc id="description">DMU 4 has the same CRS generalized-distance score of one quarter under three alpha settings. The settings divide the assessed adjustment differently between resource saving and service growth.</desc>
  <defs>
    <filter id="shadow-gdf-contract" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="650" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="44" y="42" font-size="23" font-weight="700" fill="#24323d">One productivity gap, three operating counterfactuals</text>
    <text x="44" y="70" font-size="15" fill="#5c6b73">DMU 4 today: resources (4, 8) · services (5, 4) · CRS technology</text>
    <rect x="44" y="96" width="992" height="82" rx="12" fill="#eef3f4" stroke="#d5dee2"/>
    <text x="68" y="126" font-size="14" font-weight="700" fill="#5c6b73">COMMON DIAGNOSIS</text>
    <text x="68" y="157" font-size="22" font-weight="700" fill="#24323d">CRS productivity efficiency δ = 0.25</text>
    <text x="1010" y="145" text-anchor="end" font-size="16" fill="#5c6b73">&#945; changes where the adjustment is recorded — not the total gap</text>
    <g filter="url(#shadow-gdf-contract)">
      <rect x="44" y="212" width="320" height="314" rx="12" fill="#f8fafb" stroke="#d5dee2"/>
    </g>
    <rect x="44" y="212" width="320" height="62" rx="12" fill="#176b73" opacity="0.14"/>
    <rect x="44" y="258" width="320" height="16" fill="#176b73" opacity="0.14"/>
    <text x="64" y="240" font-size="21" font-weight="700" fill="#176b73">&#945; = 0</text>
    <text x="64" y="263" font-size="14" font-weight="700" fill="#176b73">Services held fixed</text>
    <text x="64" y="315" font-size="15" fill="#24323d">Resources (x₁, x₂): (1, 2)</text>
    <text x="64" y="348" font-size="15" fill="#24323d">Services (y₁, y₂): (5, 4)</text>
    <line x1="64" y1="378" x2="344" y2="378" stroke="#d5dee2"/>
    <text x="64" y="410" font-size="13" font-weight="700" fill="#5c6b73">ASSESSED CHANGE</text>
    <text x="64" y="444" font-size="17" font-weight="700" fill="#176b73">Save 75% of every resource</text>
    <rect x="64" y="474" width="280" height="30" rx="15" fill="#176b73" opacity="0.12"/>
    <text x="204" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#176b73">δ = 0.25</text>
    <g filter="url(#shadow-gdf-contract)">
      <rect x="380" y="212" width="320" height="314" rx="12" fill="#f8fafb" stroke="#d5dee2"/>
    </g>
    <rect x="380" y="212" width="320" height="62" rx="12" fill="#d97732" opacity="0.14"/>
    <rect x="380" y="258" width="320" height="16" fill="#d97732" opacity="0.14"/>
    <text x="400" y="240" font-size="21" font-weight="700" fill="#d97732">&#945; = 0.5</text>
    <text x="400" y="263" font-size="14" font-weight="700" fill="#d97732">Both margins assessed</text>
    <text x="400" y="315" font-size="15" fill="#24323d">Resources (x₁, x₂): (2, 4)</text>
    <text x="400" y="348" font-size="15" fill="#24323d">Services (y₁, y₂): (10, 8)</text>
    <line x1="400" y1="378" x2="680" y2="378" stroke="#d5dee2"/>
    <text x="400" y="410" font-size="13" font-weight="700" fill="#5c6b73">ASSESSED CHANGE</text>
    <text x="400" y="444" font-size="17" font-weight="700" fill="#d97732">Halve resources and double services</text>
    <rect x="400" y="474" width="280" height="30" rx="15" fill="#d97732" opacity="0.12"/>
    <text x="540" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#d97732">δ = 0.25</text>
    <g filter="url(#shadow-gdf-contract)">
      <rect x="716" y="212" width="320" height="314" rx="12" fill="#f8fafb" stroke="#d5dee2"/>
    </g>
    <rect x="716" y="212" width="320" height="62" rx="12" fill="#76528f" opacity="0.14"/>
    <rect x="716" y="258" width="320" height="16" fill="#76528f" opacity="0.14"/>
    <text x="736" y="240" font-size="21" font-weight="700" fill="#76528f">&#945; = 1</text>
    <text x="736" y="263" font-size="14" font-weight="700" fill="#76528f">Resources held fixed</text>
    <text x="736" y="315" font-size="15" fill="#24323d">Resources (x₁, x₂): (4, 8)</text>
    <text x="736" y="348" font-size="15" fill="#24323d">Services (y₁, y₂): (20, 16)</text>
    <line x1="736" y1="378" x2="1016" y2="378" stroke="#d5dee2"/>
    <text x="736" y="410" font-size="13" font-weight="700" fill="#5c6b73">ASSESSED CHANGE</text>
    <text x="736" y="444" font-size="17" font-weight="700" fill="#76528f">Keep resources and quadruple services</text>
    <rect x="736" y="474" width="280" height="30" rx="15" fill="#76528f" opacity="0.12"/>
    <text x="876" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#76528f">δ = 0.25</text>
    <rect x="44" y="560" width="992" height="55" rx="10" fill="#24323d"/>
    <text x="540" y="584" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Choose &#945; to represent the study&apos;s adjustment path</text>
    <text x="540" y="604" text-anchor="middle" font-size="13" fill="#dce5e7">Treat them as analyst-declared counterfactuals unless an institution has adopted one.</text>
  </g>
</svg>
