<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
<title id="title">Most productive scale size as an average-productivity profile</title>
<desc id="description">The best attainable services per resource bundle rise to a maximum at B, remain at that maximum through C, and then decline. Q operates within the B to C scale band but below the best attainable result at the same resource scale.</desc>
