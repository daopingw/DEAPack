<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title description">
<title id="title">One productivity change, two literature-defined allocation ledgers</title>
<desc id="description">FGNZ and Ray--Desli allocate the same productivity change and pure-efficiency change to different opportunity and scale factors.</desc>
<rect width="1080" height="500" fill="#ffffff"/>
<text x="540" y="38" text-anchor="middle" font-size="24" font-weight="750" fill="#24323d">One productivity change, two literature-defined allocation ledgers</text>
<text x="540" y="66" text-anchor="middle" font-size="14.5" fill="#5c6b74">Organization D, 2020&#8211;2021 · common CRS Malmquist index = 1.1307</text>
<rect x="28" y="91" width="1024" height="151" rx="16" fill="#f7fafb" stroke="#aebdc3"/>
<rect x="28" y="257" width="1024" height="151" rx="16" fill="#f2f9f9" stroke="#79afb4" stroke-width="1.8"/>
<text x="43" y="119" font-size="15" font-weight="750" fill="#356fa3">ENHANCED FGNZ METHOD</text>
<text x="43" y="139" font-size="12.5" fill="#5c6b74">public six-task source method</text>
<text x="43" y="285" font-size="15" font-weight="750" fill="#176b73">RAY&#8211;DESLI METHOD</text>
<text x="43" y="305" font-size="12.5" fill="#5c6b74">public source-qualified eight-task method</text>
<text x="340" y="99" text-anchor="middle" font-size="10.5" font-weight="650" fill="#5c6b74">
<tspan x="340" dy="0">PURE OPERATING</tspan>
<tspan x="340" dy="11">PERFORMANCE</tspan>
</text>
<text x="524" y="99" text-anchor="middle" font-size="10.5" font-weight="650" fill="#5c6b74">
<tspan x="524" dy="0">REPRESENTED</tspan>
<tspan x="524" dy="11">OPPORTUNITIES</tspan>
</text>
<text x="708" y="99" text-anchor="middle" font-size="10.5" font-weight="650" fill="#5c6b74">
<tspan x="708" dy="0">SCALE-RELATED</tspan>
<tspan x="708" dy="11">ACCOUNT</tspan>
</text>
<text x="938" y="99" text-anchor="middle" font-size="10.5" font-weight="650" fill="#5c6b74">
<tspan x="938" dy="0">OVERALL</tspan>
<tspan x="938" dy="11">CHANGE</tspan>
</text>
