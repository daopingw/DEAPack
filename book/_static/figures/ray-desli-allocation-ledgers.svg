<text x="540" y="448" text-anchor="middle" font-size="13.5" font-weight="700" fill="#24323d">Factors multiply; equal-width boxes are not additive shares.</text>
<text x="540" y="467" text-anchor="middle" font-size="12.5" fill="#5c6b74">Both rows are benchmark-conditional accounts, not causal explanations of management or innovation.</text>
