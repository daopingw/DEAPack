<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">The management account behind a radial metafrontier decomposition</title>
<desc id="description">One organization produces two services with four resources. Its group opportunity supports four services and the pooled opportunity supports eight, yielding group efficiency one half, MTR one half, and metafrontier efficiency one quarter.</desc>
<rect width="1200" height="720" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect width="1200" height="720" fill="#f7fafc"/>
<text x="60" y="58" text-anchor="start" font-size="30" font-weight="700" fill="#24323d">One organization, three performance accounts</text>
<text x="60" y="88" text-anchor="start" font-size="17" font-weight="400" fill="#687780">The operation stays fixed; only the represented opportunity set changes.</text>
<rect x="55" y="130" width="300" height="300" rx="18" fill="#ffffff" stroke="#687780" stroke-width="2"/>
<text x="85" y="172" text-anchor="start" font-size="21" font-weight="700" fill="#24323d">Observed operation</text>
<text x="85" y="200" text-anchor="start" font-size="15" font-weight="400" fill="#687780">Organization C · Group 1</text>
<line x1="85" y1="340" x2="325" y2="340" stroke="#e2e8f0"/>
<rect x="105" y="252" width="70" height="88" rx="6" fill="#d97732"/>
<rect x="230" y="296" width="70" height="44" rx="6" fill="#687780"/>
<text x="123" y="241" text-anchor="start" font-size="24" font-weight="700" fill="#24323d">4</text>
<text x="252" y="284" text-anchor="start" font-size="24" font-weight="700" fill="#24323d">2</text>
<text x="95" y="370" text-anchor="start" font-size="15" font-weight="400" fill="#24323d">Resource units</text>
<text x="230" y="370" text-anchor="start" font-size="15" font-weight="400" fill="#24323d">Services</text>
<text x="85" y="404" text-anchor="start" font-size="14" font-weight="400" fill="#687780">What the organization actually delivered</text>
<rect x="450" y="130" width="300" height="300" rx="18" fill="#ffffff" stroke="#176b73" stroke-width="2"/>
<text x="480" y="172" text-anchor="start" font-size="21" font-weight="700" fill="#24323d">Group opportunity</text>
<text x="480" y="200" text-anchor="start" font-size="15" font-weight="400" fill="#687780">Best practice within Group 1</text>
<line x1="480" y1="340" x2="720" y2="340" stroke="#e2e8f0"/>
<rect x="500" y="252" width="70" height="88" rx="6" fill="#d97732"/>
<rect x="625" y="252" width="70" height="88" rx="6" fill="#176b73"/>
<text x="518" y="241" text-anchor="start" font-size="24" font-weight="700" fill="#24323d">4</text>
<text x="647" y="240" text-anchor="start" font-size="24" font-weight="700" fill="#24323d">4</text>
<text x="490" y="370" text-anchor="start" font-size="15" font-weight="400" fill="#24323d">Resource units</text>
<text x="625" y="370" text-anchor="start" font-size="15" font-weight="400" fill="#24323d">Services</text>
<text x="480" y="404" text-anchor="start" font-size="15" font-weight="700" fill="#176b73">Group efficiency = 2 ÷ 4 = 0.50</text>
<rect x="845" y="130" width="300" height="300" rx="18" fill="#ffffff" stroke="#356fa3" stroke-width="2"/>
<text x="875" y="172" text-anchor="start" font-size="21" font-weight="700" fill="#24323d">Pooled meta opportunity</text>
<text x="875" y="200" text-anchor="start" font-size="15" font-weight="400" fill="#687780">Best practice across groups</text>
<line x1="875" y1="340" x2="1115" y2="340" stroke="#e2e8f0"/>
<rect x="895" y="252" width="70" height="88" rx="6" fill="#d97732"/>
<rect x="1020" y="164" width="70" height="176" rx="6" fill="#356fa3"/>
<text x="913" y="241" text-anchor="start" font-size="24" font-weight="700" fill="#24323d">4</text>
<text x="1042" y="152" text-anchor="start" font-size="24" font-weight="700" fill="#24323d">8</text>
<text x="885" y="370" text-anchor="start" font-size="15" font-weight="400" fill="#24323d">Resource units</text>
<text x="1020" y="370" text-anchor="start" font-size="15" font-weight="400" fill="#24323d">Services</text>
<text x="875" y="404" text-anchor="start" font-size="15" font-weight="700" fill="#356fa3">Meta efficiency = 2 ÷ 8 = 0.25</text>
<line x1="365" y1="245" x2="427" y2="245" stroke="#687780" stroke-width="3"/>
<path d="M427 238 L441 245 L427 252 z" fill="#687780"/>
<line x1="760" y1="245" x2="822" y2="245" stroke="#687780" stroke-width="3"/>
<path d="M822 238 L836 245 L822 252 z" fill="#687780"/>
<rect x="170" y="475" width="860" height="105" rx="20" fill="#1e3a8a"/>
<text x="600" y="520" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">0.25 meta efficiency = 0.50 group efficiency × 0.50 MTR</text>
<text x="600" y="551" text-anchor="middle" font-size="15" font-weight="400" fill="#dbeafe">A larger MTR means closer proximity to represented pooled opportunities.</text>
<rect x="85" y="615" width="1030" height="68" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="115" y="645" text-anchor="start" font-size="15" font-weight="700" fill="#7c2d12">This is an accounting decomposition—not a causal attribution.</text>
<text x="115" y="668" text-anchor="start" font-size="15" font-weight="700" fill="#7c2d12">A pooled VRS benchmark may be a virtual cross-group combination.</text>
</g>
</svg>
