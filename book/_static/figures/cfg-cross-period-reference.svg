<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
<title id="title">A cleaner, higher-service plan evaluated against an old CFG reference technology</title>
<desc id="description">The horizontal axis is undesirable residual b and the vertical axis is desirable service y. The old plan is at y equals 1 and b equals 2 on the old technology frontier. The cleaner, higher-service new plan is at y equals 2 and b equals 1, outside the old feasible set. A dashed reverse CFG comparison leads down and right to the old-reference target at y equals four fifths and b equals eight fifths, with beta equal to negative three fifths. The signed reference gap is not a better-or-worse ranking.</desc>
<defs>
  <pattern id="feasible-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
    <rect width="10" height="10" fill="#edf3f3"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#b8c8ca" stroke-width="2"/>
  </pattern>
  <marker id="axis-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
    <path d="M0,0 L0,8 L8,4 z" fill="#24323d"/>
  </marker>
  <marker id="reverse-arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,8 L10,4 z" fill="#76528f"/>
  </marker>
</defs>

<rect width="1000" height="620" fill="white"/>

<g font-family="Arial, Helvetica, sans-serif" fill="#24323d">
  <text x="52" y="42" font-size="25" font-weight="700">Cross-period environmental reference comparison</text>
  <text x="52" y="68" font-size="16" fill="#687780">Can the old operating technology reproduce the cleaner, higher-service New plan?</text>

  <!-- Plot grid -->
  <g stroke="#dce5e7" stroke-width="1">
    <line x1="340" y1="88" x2="340" y2="530"/>
    <line x1="580" y1="88" x2="580" y2="530"/>
    <line x1="100" y1="346" x2="700" y2="346"/>
    <line x1="100" y1="162" x2="700" y2="162"/>
  </g>

  <!-- Old feasible technology at fixed input -->
  <path d="M100 530 L580 346 L580 530 Z" fill="url(#feasible-hatch)" stroke="#8d9aa0" stroke-width="1.5"/>
  <path d="M100 530 L580 346" fill="none" stroke="#24323d" stroke-width="4" stroke-linecap="round"/>
  <text x="242" y="430" font-size="17" font-weight="600">Old technology</text>
  <text x="242" y="452" font-size="15" fill="#687780">feasible set at fixed input</text>
  <line x1="311" y1="414" x2="382" y2="395" stroke="#687780" stroke-width="1.5"/>
  <text x="410" y="380" font-size="16" font-weight="600">Old feasible frontier</text>
  <text x="410" y="401" font-size="14" fill="#687780">y = b / 2</text>

  <!-- Axes -->
  <line x1="100" y1="530" x2="716" y2="530" stroke="#24323d" stroke-width="2.2" marker-end="url(#axis-arrow)"/>
  <line x1="100" y1="530" x2="100" y2="82" stroke="#24323d" stroke-width="2.2" marker-end="url(#axis-arrow)"/>
  <text x="401" y="592" text-anchor="middle" font-size="18" font-weight="600">Undesirable residual, b</text>
  <text x="25" y="306" text-anchor="middle" font-size="18" font-weight="600" transform="rotate(-90 25 306)">Desirable service, y</text>

  <!-- Axis ticks -->
  <g font-size="14" fill="#687780">
    <line x1="100" y1="530" x2="100" y2="537" stroke="#24323d" stroke-width="1.5"/>
    <text x="100" y="557" text-anchor="middle">0</text>
    <line x1="340" y1="530" x2="340" y2="537" stroke="#24323d" stroke-width="1.5"/>
    <text x="340" y="557" text-anchor="middle">1</text>
    <line x1="580" y1="530" x2="580" y2="537" stroke="#24323d" stroke-width="1.5"/>
    <text x="580" y="557" text-anchor="middle">2</text>
    <line x1="93" y1="346" x2="100" y2="346" stroke="#24323d" stroke-width="1.5"/>
    <text x="82" y="351" text-anchor="end">1</text>
    <line x1="93" y1="162" x2="100" y2="162" stroke="#24323d" stroke-width="1.5"/>
    <text x="82" y="167" text-anchor="end">2</text>
  </g>

  <!-- Reverse reference comparison -->
  <path d="M350 178 L478 374" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <path d="M350 178 L478 374" fill="none" stroke="#76528f" stroke-width="4" stroke-dasharray="10 7" stroke-linecap="round" marker-end="url(#reverse-arrow)"/>
  <rect x="422" y="225" width="210" height="72" rx="9" fill="white" stroke="#bba8c9" stroke-width="1.5"/>
  <text x="527" y="251" text-anchor="middle" font-size="15" font-weight="700" fill="#76528f">Reverse CFG comparison</text>
  <text x="527" y="276" text-anchor="middle" font-size="18" font-weight="700" fill="#76528f">&#946; = &#8722;3/5</text>

  <!-- Old observation: filled circle -->
  <circle cx="580" cy="346" r="9" fill="#176b73" stroke="white" stroke-width="3"/>
  <circle cx="580" cy="346" r="11.5" fill="none" stroke="#24323d" stroke-width="1.5"/>
  <text x="596" y="329" font-size="16" font-weight="700">Old</text>
  <text x="596" y="350" font-size="14" fill="#687780">(y=1, b=2)</text>

  <!-- New observation: filled diamond -->
  <path d="M340 149 L353 162 L340 175 L327 162 Z" fill="#d97732" stroke="white" stroke-width="2.5"/>
  <path d="M340 146 L356 162 L340 178 L324 162 Z" fill="none" stroke="#24323d" stroke-width="1.5"/>
  <text x="363" y="131" font-size="17" font-weight="700">New (y=2, b=1)</text>
  <text x="363" y="152" font-size="14" fill="#d97732">cleaner + higher service</text>
  <text x="363" y="173" font-size="14" font-weight="600">outside the old feasible set</text>

  <!-- Old-reference target: open square -->
  <rect x="475" y="374" width="18" height="18" rx="2" fill="white" stroke="#76528f" stroke-width="3"/>
  <line x1="484" y1="392" x2="484" y2="418" stroke="#76528f" stroke-width="1.5"/>
  <text x="484" y="439" text-anchor="middle" font-size="15" font-weight="700" fill="#76528f">Old-reference target</text>
  <text x="484" y="460" text-anchor="middle" font-size="14" fill="#687780">(y=4/5, b=8/5)</text>

  <!-- Management interpretation -->
  <rect x="735" y="104" width="235" height="386" rx="14" fill="#f4f6f7" stroke="#c9d2d6" stroke-width="2"/>
  <text x="758" y="139" font-size="16" font-weight="700" fill="#687780">MANAGEMENT INTERPRETATION</text>
  <line x1="758" y1="153" x2="947" y2="153" stroke="#c9d2d6" stroke-width="1.5"/>

  <text x="758" y="190" font-size="19" font-weight="700">
    <tspan x="758" dy="0">The old reference cannot</tspan>
    <tspan x="758" dy="27">reproduce the cleaner,</tspan>
    <tspan x="758" dy="27">higher-service New plan.</tspan>
  </text>

  <circle cx="766" cy="292" r="4" fill="#176b73"/>
  <text x="780" y="288" font-size="15">
    <tspan x="780" dy="0">New lies outside the old</tspan>
    <tspan x="780" dy="21">technology set.</tspan>
  </text>

  <circle cx="766" cy="355" r="4" fill="#76528f"/>
  <text x="780" y="351" font-size="15">
    <tspan x="780" dy="0">Negative &#946; reverses the</tspan>
    <tspan x="780" dy="21">declared CFG path to reach</tspan>
    <tspan x="780" dy="21">an old-reference target.</tspan>
  </text>

  <rect x="755" y="423" width="195" height="48" rx="8" fill="white" stroke="#76528f" stroke-width="1.5"/>
  <text x="852.5" y="443" text-anchor="middle" font-size="14" font-weight="700" fill="#76528f">SIGNED REFERENCE GAP</text>
  <text x="852.5" y="462" text-anchor="middle" font-size="13" fill="#24323d">not a better/worse ranking</text>

  <!-- Exact comparison account -->
  <text x="735" y="535" font-size="15" font-weight="700">Comparison account in (y, b):</text>
  <text x="735" y="561" font-size="15" fill="#76528f">(2, 1) + (&#8722;3/5)(2, &#8722;1) = (4/5, 8/5)</text>
</g>
</svg>
