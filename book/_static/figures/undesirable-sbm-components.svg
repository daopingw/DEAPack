<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
<title id="title">Three relative slack components in undesirable-output SBM</title>
<desc id="description">Independent normalized improvements reduce an input, expand a desirable output, and reduce an undesirable output.</desc>
<defs>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#176b73"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97732"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#76528f"/></marker>
<marker id="axis-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#24323d"/></marker>
</defs>
<rect width="760" height="500" fill="white"/>
<text x="82" y="147" font-size="25" font-style="italic" font-weight="600" fill="#24323d">x</text>
<line x1="175" y1="140" x2="650" y2="140" stroke="#dce5e7" stroke-width="6" stroke-linecap="round"/>
<line x1="610" y1="140" x2="420" y2="140" stroke="#176b73" stroke-width="4" marker-end="url(#arrow-teal)"/>
<circle cx="610" cy="140" r="9" fill="#24323d" stroke="white" stroke-width="2"/>
<circle cx="420" cy="140" r="8" fill="white" stroke="#176b73" stroke-width="3"/>
<text x="515.0" y="118" text-anchor="middle" font-size="18" fill="#176b73">s⁻ / x = 20%</text>
<text x="82" y="272" font-size="25" font-style="italic" font-weight="600" fill="#24323d">y</text>
<line x1="175" y1="265" x2="650" y2="265" stroke="#dce5e7" stroke-width="6" stroke-linecap="round"/>
<line x1="390" y1="265" x2="610" y2="265" stroke="#d97732" stroke-width="4" marker-end="url(#arrow-orange)"/>
<circle cx="390" cy="265" r="9" fill="#24323d" stroke="white" stroke-width="2"/>
<circle cx="610" cy="265" r="8" fill="white" stroke="#d97732" stroke-width="3"/>
<text x="500.0" y="243" text-anchor="middle" font-size="18" fill="#d97732">s⁺ / y = 25%</text>
<text x="82" y="397" font-size="25" font-style="italic" font-weight="600" fill="#24323d">b</text>
<line x1="175" y1="390" x2="650" y2="390" stroke="#dce5e7" stroke-width="6" stroke-linecap="round"/>
<line x1="610" y1="390" x2="455" y2="390" stroke="#76528f" stroke-width="4" marker-end="url(#arrow-purple)"/>
<circle cx="610" cy="390" r="9" fill="#24323d" stroke="white" stroke-width="2"/>
<circle cx="455" cy="390" r="8" fill="white" stroke="#76528f" stroke-width="3"/>
<text x="532.5" y="368" text-anchor="middle" font-size="18" fill="#76528f">sᵇ / b = 30%</text>
<circle cx="250" cy="460" r="8" fill="#24323d"/>
<text x="268" y="466" font-size="16" fill="#24323d">observed</text>
<circle cx="455" cy="460" r="8" fill="white" stroke="#176b73" stroke-width="3"/>
<text x="473" y="466" font-size="16" fill="#24323d">target</text>
</svg>
