<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title description">
  <title id="title">Return-on-cost diagnostic dashboard</title>
  <desc id="description">Four organizations are compared by cost, revenue per unit of cost, overall profitability efficiency, and operating, scale, and offering-mix factors. Organizations S and T both score one quarter overall but require different management responses.</desc>
  <defs>
    <filter id="shadow-rtd" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="700" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="44" y="42" font-size="22" font-weight="700" fill="#24323d">The same profitability score can conceal a different management problem</text>
    <text x="44" y="69" font-size="15" fill="#5c6b73">One input at w = 1 · two services at p = (1, 2) · best revenue per £1 = 3.00</text>
    <g filter="url(#shadow-rtd)">
      <rect x="44" y="94" width="480" height="222" rx="12" fill="#f8fafb" stroke="#d5dee2"/>
    </g>
    <rect x="44" y="94" width="480" height="50" rx="12" fill="#176b73" opacity="0.13"/>
    <rect x="44" y="132" width="480" height="12" fill="#176b73" opacity="0.13"/>
    <text x="62" y="126" font-size="18" font-weight="700" fill="#176b73">B · best operating model</text>
    <text x="452" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#176b73">1.00</text>
    <text x="62" y="170" font-size="14" fill="#5c6b73">x = 4 · y = (4, 4)</text>
    <text x="62" y="195" font-size="15" fill="#24323d">Cost 4 · Revenue 12 · Revenue per £1 = 3.00</text>
    <rect x="62" y="215" width="132" height="48" rx="8" fill="#e8f1f2" opacity="1"/>
    <text x="128" y="234" text-anchor="middle" font-size="12" fill="#176b73">Operations</text>
    <text x="128" y="254" text-anchor="middle" font-size="17" font-weight="700" fill="#176b73">1.00</text>
    <rect x="209" y="215" width="132" height="48" rx="8" fill="#e8f1f2" opacity="1"/>
    <text x="275" y="234" text-anchor="middle" font-size="12" fill="#176b73">Scale</text>
    <text x="275" y="254" text-anchor="middle" font-size="17" font-weight="700" fill="#176b73">1.00</text>
    <rect x="356" y="215" width="132" height="48" rx="8" fill="#e8f1f2" opacity="1"/>
    <text x="422" y="234" text-anchor="middle" font-size="12" fill="#176b73">Mix</text>
    <text x="422" y="254" text-anchor="middle" font-size="17" font-weight="700" fill="#176b73">1.00</text>
    <text x="62" y="294" font-size="14" font-weight="700" fill="#176b73">Action: Protect the operating model and learn from it</text>
    <g filter="url(#shadow-rtd)">
      <rect x="556" y="94" width="480" height="222" rx="12" fill="#f8fafb" stroke="#d5dee2"/>
    </g>
    <rect x="556" y="94" width="480" height="50" rx="12" fill="#d97732" opacity="0.13"/>
    <rect x="556" y="132" width="480" height="12" fill="#d97732" opacity="0.13"/>
    <text x="574" y="126" font-size="18" font-weight="700" fill="#d97732">A · offering-mix issue</text>
    <text x="964" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#d97732">0.67</text>
    <text x="574" y="170" font-size="14" fill="#5c6b73">x = 4 · y = (6, 1)</text>
    <text x="574" y="195" font-size="15" fill="#24323d">Cost 4 · Revenue 8 · Revenue per £1 = 2.00</text>
    <rect x="574" y="215" width="132" height="48" rx="8" fill="#e8f1f2" opacity="1"/>
    <text x="640" y="234" text-anchor="middle" font-size="12" fill="#176b73">Operations</text>
    <text x="640" y="254" text-anchor="middle" font-size="17" font-weight="700" fill="#176b73">1.00</text>
    <rect x="721" y="215" width="132" height="48" rx="8" fill="#e8f1f2" opacity="1"/>
    <text x="787" y="234" text-anchor="middle" font-size="12" fill="#176b73">Scale</text>
    <text x="787" y="254" text-anchor="middle" font-size="17" font-weight="700" fill="#176b73">1.00</text>
    <rect x="868" y="215" width="132" height="48" rx="8" fill="#d97732" opacity="0.92"/>
    <text x="934" y="234" text-anchor="middle" font-size="12" fill="#ffffff">Mix</text>
    <text x="934" y="254" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">0.67</text>
    <text x="574" y="294" font-size="14" font-weight="700" fill="#d97732">Action: Rebalance the service portfolio</text>
    <g filter="url(#shadow-rtd)">
      <rect x="44" y="346" width="480" height="222" rx="12" fill="#f8fafb" stroke="#d5dee2"/>
    </g>
    <rect x="44" y="346" width="480" height="50" rx="12" fill="#76528f" opacity="0.13"/>
    <rect x="44" y="384" width="480" height="12" fill="#76528f" opacity="0.13"/>
    <text x="62" y="378" font-size="18" font-weight="700" fill="#76528f">S · scale issue</text>
    <text x="452" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#76528f">0.25</text>
    <text x="62" y="422" font-size="14" fill="#5c6b73">x = 1 · y = (0.25, 0.25)</text>
    <text x="62" y="447" font-size="15" fill="#24323d">Cost 1 · Revenue 0.75 · Revenue per £1 = 0.75</text>
    <rect x="62" y="467" width="132" height="48" rx="8" fill="#e8f1f2" opacity="1"/>
    <text x="128" y="486" text-anchor="middle" font-size="12" fill="#176b73">Operations</text>
    <text x="128" y="506" text-anchor="middle" font-size="17" font-weight="700" fill="#176b73">1.00</text>
    <rect x="209" y="467" width="132" height="48" rx="8" fill="#76528f" opacity="0.92"/>
    <text x="275" y="486" text-anchor="middle" font-size="12" fill="#ffffff">Scale</text>
    <text x="275" y="506" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">0.25</text>
    <rect x="356" y="467" width="132" height="48" rx="8" fill="#e8f1f2" opacity="1"/>
    <text x="422" y="486" text-anchor="middle" font-size="12" fill="#176b73">Mix</text>
    <text x="422" y="506" text-anchor="middle" font-size="17" font-weight="700" fill="#176b73">1.00</text>
    <text x="62" y="546" font-size="14" font-weight="700" fill="#76528f">Action: Revisit footprint, demand, and capacity</text>
    <g filter="url(#shadow-rtd)">
      <rect x="556" y="346" width="480" height="222" rx="12" fill="#f8fafb" stroke="#d5dee2"/>
    </g>
    <rect x="556" y="346" width="480" height="50" rx="12" fill="#356fa3" opacity="0.13"/>
    <rect x="556" y="384" width="480" height="12" fill="#356fa3" opacity="0.13"/>
    <text x="574" y="378" font-size="18" font-weight="700" fill="#356fa3">T · operating-process issue</text>
    <text x="964" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#356fa3">0.25</text>
    <text x="574" y="422" font-size="14" fill="#5c6b73">x = 8 · y = (2, 2)</text>
    <text x="574" y="447" font-size="15" fill="#24323d">Cost 8 · Revenue 6 · Revenue per £1 = 0.75</text>
    <rect x="574" y="467" width="132" height="48" rx="8" fill="#356fa3" opacity="0.92"/>
    <text x="640" y="486" text-anchor="middle" font-size="12" fill="#ffffff">Operations</text>
    <text x="640" y="506" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">0.25</text>
    <rect x="721" y="467" width="132" height="48" rx="8" fill="#e8f1f2" opacity="1"/>
    <text x="787" y="486" text-anchor="middle" font-size="12" fill="#176b73">Scale</text>
    <text x="787" y="506" text-anchor="middle" font-size="17" font-weight="700" fill="#176b73">1.00</text>
    <rect x="868" y="467" width="132" height="48" rx="8" fill="#e8f1f2" opacity="1"/>
    <text x="934" y="486" text-anchor="middle" font-size="12" fill="#176b73">Mix</text>
    <text x="934" y="506" text-anchor="middle" font-size="17" font-weight="700" fill="#176b73">1.00</text>
    <text x="574" y="546" font-size="14" font-weight="700" fill="#356fa3">Action: Redesign the operating process</text>
    <rect x="44" y="610" width="992" height="54" rx="10" fill="#eef3f4"/>
    <text x="540" y="634" text-anchor="middle" font-size="16" font-weight="700" fill="#24323d">Overall profitability efficiency = Operations &#215; Scale &#215; Offering mix</text>
    <text x="540" y="654" text-anchor="middle" font-size="13" fill="#5c6b73">S and T both score 0.25; one needs a scale decision, the other an operating redesign.</text>
  </g>
</svg>
