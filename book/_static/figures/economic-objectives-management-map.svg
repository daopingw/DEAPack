<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-labelledby="title description">
  <title id="title">One operating plan, three core price-informed decisions and one directional bridge</title>
  <desc id="description">Observed Plan D uses six resource units to provide three standard and two premium services. A minimum-cost comparison preserves its service commitments, a maximum-revenue comparison preserves its resource capacity, a maximum-profit comparison chooses both sides jointly. These three core decisions appear as the primary cards. A smaller secondary directional bridge then values one declared improvement package against the profit gap. All accounts use the same four-plan VRS technology.</desc>
  <defs>
    <marker id="arrow-economic-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#176b73"/></marker>
    <marker id="arrow-economic-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97732"/></marker>
    <marker id="arrow-economic-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#76528f"/></marker>
    <filter id="shadow-economic" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24323d" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1080" height="720" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="540" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#24323d">The objective determines what counts as an improvement</text>
    <text x="540" y="63" text-anchor="middle" font-size="15" fill="#5c6b73">Same four-plan VRS technology · w = 2 · p = (3, 5)</text>

    <g filter="url(#shadow-economic)">
      <rect x="353" y="82" width="374" height="142" rx="14" fill="#f5f7f8" stroke="#aebbc1" stroke-width="1.5"/>
    </g>
    <text x="540" y="113" text-anchor="middle" font-size="18" font-weight="700" fill="#24323d">Observed Plan D</text>
    <text x="540" y="142" text-anchor="middle" font-size="16" fill="#24323d">resource x = 6 · services y = (3, 2)</text>
    <text x="540" y="170" text-anchor="middle" font-size="16" fill="#24323d">cost = 12 · revenue = 19 · profit = 7</text>
    <text x="540" y="203" text-anchor="middle" font-size="14" fill="#5c6b73">Which opportunity matters depends on the decision question.</text>

    <path d="M458 224 C390 249 279 254 184 291" fill="none" stroke="#176b73" stroke-width="3" marker-end="url(#arrow-economic-teal)"/>
    <path d="M540 224 L540 289" fill="none" stroke="#d97732" stroke-width="3" marker-end="url(#arrow-economic-orange)"/>
    <path d="M622 224 C690 249 801 254 896 291" fill="none" stroke="#76528f" stroke-width="3" marker-end="url(#arrow-economic-purple)"/>
    <text x="272" y="253" text-anchor="middle" font-size="12.5" font-weight="700" fill="#176b73">preserve service commitments</text>
    <text x="540" y="253" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a65119">preserve resource capacity</text>
    <text x="808" y="253" text-anchor="middle" font-size="12.5" font-weight="700" fill="#66427c">choose inputs and outputs jointly</text>

    <g filter="url(#shadow-economic)">
      <rect x="30" y="300" width="320" height="236" rx="14" fill="#eef7f7" stroke="#73aeb3"/>
      <rect x="380" y="300" width="320" height="236" rx="14" fill="#fff7ef" stroke="#e4a46f"/>
      <rect x="730" y="300" width="320" height="236" rx="14" fill="#f7f1fa" stroke="#a98abb"/>
    </g>
    <rect x="30" y="300" width="320" height="55" rx="14" fill="#dceff0"/>
    <rect x="380" y="300" width="320" height="55" rx="14" fill="#f8e8dc"/>
    <rect x="730" y="300" width="320" height="55" rx="14" fill="#eee4f3"/>
    <rect x="30" y="341" width="320" height="14" fill="#dceff0"/>
    <rect x="380" y="341" width="320" height="14" fill="#f8e8dc"/>
    <rect x="730" y="341" width="320" height="14" fill="#eee4f3"/>

    <text x="190" y="335" text-anchor="middle" font-size="18" font-weight="700" fill="#176b73">Minimum cost</text>
    <text x="540" y="335" text-anchor="middle" font-size="18" font-weight="700" fill="#a65119">Maximum revenue</text>
    <text x="890" y="335" text-anchor="middle" font-size="18" font-weight="700" fill="#66427c">Maximum profit</text>

    <g font-size="15" fill="#24323d">
      <text x="52" y="391">Target: 0.25B + 0.75C</text>
      <text x="52" y="421">x̂ = 3.5 · ŷ = (4.75, 2)</text>
      <text x="52" y="461">minimum cost = 7</text>
      <text x="52" y="491">cost efficiency = 7/12</text>
      <text x="52" y="521">technical = 7/12 · allocative = 1</text>

      <text x="402" y="391">Resource envelope: x ≤ 6</text>
      <text x="402" y="421">Target B: x̂ = 5 · ŷ = (4, 5)</text>
      <text x="402" y="461">maximum revenue = 37</text>
      <text x="402" y="491">observed revenue = 19</text>
      <text x="402" y="521">revenue efficiency = 19/37</text>

      <text x="752" y="391">Inputs and outputs may change</text>
      <text x="752" y="421">Target B: x̂ = 5 · ŷ = (4, 5)</text>
      <text x="752" y="461">maximum profit = 27</text>
      <text x="752" y="491">observed profit = 7</text>
      <text x="752" y="521">profit gap = 20</text>
    </g>

    <path d="M890 536 C890 557 824 558 824 575" fill="none" stroke="#9aa8ae" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-economic-purple)"/>
    <text x="810" y="558" text-anchor="end" font-size="11.5" font-weight="700" fill="#687780">interpret part of the profit gap</text>
    <rect x="230" y="579" width="620" height="96" rx="10" fill="#f6f4f7" stroke="#c9bdcf" stroke-width="1"/>
    <text x="250" y="601" font-size="11" font-weight="700" letter-spacing="0.8" fill="#687780">SECONDARY INTERPRETIVE BRIDGE</text>
    <text x="250" y="625" font-size="15" font-weight="700" fill="#66427c">Directional target T: x̂ = 4.4 · ŷ = (4.6, 3.6) · profit at T = 23</text>
    <text x="250" y="647" font-size="14" fill="#24323d">profit recovery = 16 technical + 4 allocative · ν = 10</text>
    <text x="250" y="668" font-size="14" fill="#24323d">NI = 2.0 = 1.6 + 0.4 programme units</text>

    <text x="540" y="692" text-anchor="middle" font-size="13" fill="#5c6b73">Prices convert quantities into value; the technology still determines which alternatives are feasible.</text>
    <text x="540" y="712" text-anchor="middle" font-size="12" fill="#687780">These conditional comparisons neither identify the cause of a gap nor prescribe an implementation path.</text>
  </g>
</svg>
