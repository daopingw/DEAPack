<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title description">
<title id="title">One operating trajectory joined by four kinds of carry-over</title>
<desc id="description">Four period operating plans are joined by beneficial capacity, harmful backlog, discretionary inventory, and fixed commitments.</desc>
<rect width="1080" height="760" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="44" text-anchor="start" font-size="24" font-weight="700" fill="#24323d">Today’s operating plan becomes part of tomorrow’s opportunity</text>
<text x="42" y="73" text-anchor="start" font-size="17" font-weight="400" fill="#687780">Dynamic SBM appraises one connected trajectory—not four scorecards.</text>
<rect x="42" y="102" width="996" height="178" rx="18" fill="#f6f9fa" stroke="#cfdadd"/>
<text x="66" y="132" text-anchor="start" font-size="15" font-weight="700" fill="#176b73">OPERATING ACCOUNTS IN EACH PERIOD</text>
<rect x="72" y="158" width="194" height="86" rx="12" fill="#ffffff" stroke="#9fc8cb"/>
<text x="169" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#24323d">Period 1</text>
<text x="169" y="214" text-anchor="middle" font-size="15" font-weight="400" fill="#687780">resources → services</text>
<text x="169" y="234" text-anchor="middle" font-size="13" font-weight="400" fill="#176b73">peer plan λ1</text>
<rect x="320" y="158" width="194" height="86" rx="12" fill="#ffffff" stroke="#9fc8cb"/>
<text x="417" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#24323d">Period 2</text>
<text x="417" y="214" text-anchor="middle" font-size="15" font-weight="400" fill="#687780">resources → services</text>
<text x="417" y="234" text-anchor="middle" font-size="13" font-weight="400" fill="#176b73">peer plan λ2</text>
<rect x="568" y="158" width="194" height="86" rx="12" fill="#ffffff" stroke="#9fc8cb"/>
<text x="665" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#24323d">Period 3</text>
<text x="665" y="214" text-anchor="middle" font-size="15" font-weight="400" fill="#687780">resources → services</text>
<text x="665" y="234" text-anchor="middle" font-size="13" font-weight="400" fill="#176b73">peer plan λ3</text>
<rect x="816" y="158" width="194" height="86" rx="12" fill="#ffffff" stroke="#9fc8cb"/>
<text x="913" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#24323d">Period 4</text>
<text x="913" y="214" text-anchor="middle" font-size="15" font-weight="400" fill="#687780">resources → services</text>
<text x="913" y="234" text-anchor="middle" font-size="13" font-weight="400" fill="#176b73">peer plan λ4</text>
<rect x="42" y="306" width="996" height="356" rx="18" fill="#fffdf9" stroke="#e2d6c7"/>
<text x="66" y="338" text-anchor="start" font-size="15" font-weight="700" fill="#8c642f">CARRY-OVERS CONNECT ADJACENT MANAGEMENT PLANS</text>
<rect x="69" y="363" width="206" height="54" rx="10" fill="#edf7f1" stroke="#237a57"/>
<text x="88" y="385" text-anchor="start" font-size="15" font-weight="700" fill="#237a57">GOOD · BENEFICIAL</text>
<text x="88" y="405" text-anchor="start" font-size="13" font-weight="400" fill="#687780">capacity, know-how, trust</text>
<line x1="293" y1="390" x2="990" y2="390" stroke="#237a57" stroke-width="5"/>
<path d="M990 382 L1008 390 L990 398 z" fill="#237a57"/>
<circle cx="417" cy="390" r="8" fill="#ffffff" stroke="#237a57" stroke-width="3"/>
<circle cx="665" cy="390" r="8" fill="#ffffff" stroke="#237a57" stroke-width="3"/>
<circle cx="913" cy="390" r="8" fill="#ffffff" stroke="#237a57" stroke-width="3"/>
<rect x="69" y="434" width="206" height="54" rx="10" fill="#fbefed" stroke="#b84a3a"/>
<text x="88" y="456" text-anchor="start" font-size="15" font-weight="700" fill="#b84a3a">BAD · HARMFUL</text>
<text x="88" y="476" text-anchor="start" font-size="13" font-weight="400" fill="#687780">backlog, debt, pollution stock</text>
<line x1="293" y1="461" x2="990" y2="461" stroke="#b84a3a" stroke-width="5"/>
<path d="M990 453 L1008 461 L990 469 z" fill="#b84a3a"/>
<circle cx="417" cy="461" r="8" fill="#ffffff" stroke="#b84a3a" stroke-width="3"/>
<circle cx="665" cy="461" r="8" fill="#ffffff" stroke="#b84a3a" stroke-width="3"/>
<circle cx="913" cy="461" r="8" fill="#ffffff" stroke="#b84a3a" stroke-width="3"/>
<rect x="69" y="505" width="206" height="54" rx="10" fill="#edf4fa" stroke="#356fa3"/>
<text x="88" y="527" text-anchor="start" font-size="15" font-weight="700" fill="#356fa3">FREE · REPLANNABLE</text>
<text x="88" y="547" text-anchor="start" font-size="13" font-weight="400" fill="#687780">inventory, liquid balances</text>
<line x1="293" y1="532" x2="990" y2="532" stroke="#356fa3" stroke-width="5"/>
<path d="M990 524 L1008 532 L990 540 z" fill="#356fa3"/>
<circle cx="417" cy="532" r="8" fill="#ffffff" stroke="#356fa3" stroke-width="3"/>
<circle cx="665" cy="532" r="8" fill="#ffffff" stroke="#356fa3" stroke-width="3"/>
<circle cx="913" cy="532" r="8" fill="#ffffff" stroke="#356fa3" stroke-width="3"/>
<rect x="69" y="576" width="206" height="54" rx="10" fill="#f4eff8" stroke="#76528f"/>
<text x="88" y="598" text-anchor="start" font-size="15" font-weight="700" fill="#76528f">FIXED · INHERITED</text>
<text x="88" y="618" text-anchor="start" font-size="13" font-weight="400" fill="#687780">regulated or contracted stock</text>
<line x1="293" y1="603" x2="990" y2="603" stroke="#76528f" stroke-width="5"/>
<path d="M990 595 L1008 603 L990 611 z" fill="#76528f"/>
<circle cx="417" cy="603" r="8" fill="#ffffff" stroke="#76528f" stroke-width="3"/>
<circle cx="665" cy="603" r="8" fill="#ffffff" stroke="#76528f" stroke-width="3"/>
<circle cx="913" cy="603" r="8" fill="#ffffff" stroke="#76528f" stroke-width="3"/>
<rect x="42" y="687" width="996" height="48" rx="12" fill="#24323d"/>
<text x="540" y="708" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">ONE HORIZON-WIDE PERFORMANCE ACCOUNT</text>
<text x="540" y="727" text-anchor="middle" font-size="14" font-weight="400" fill="#d7e2e5">Carry-over continuity makes the selected operating plan attainable.</text>
</g>
</svg>
