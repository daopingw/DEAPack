<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" role="img" aria-labelledby="title description">
<title id="title">Routes through the DEA method atlas</title>
<desc id="description">A study question leads to five production stories: one-process production, undesirable outcomes, internal process networks, intertemporal state, and productivity change. Performance criterion is selected within each route, while valuation, evaluation protocol, and uncertainty apply across all routes.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#48616d"/>
  </marker>
</defs>
<rect width="1180" height="700" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#24323d">
  <rect x="390" y="28" width="400" height="82" rx="18" fill="#173f4f"/>
  <text x="590" y="62" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">What performance question</text>
  <text x="590" y="91" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">does the organization need answered?</text>

  <path d="M590 110 L590 148 L120 148 L120 184" fill="none" stroke="#48616d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M590 148 L355 148 L355 184" fill="none" stroke="#48616d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M590 148 L590 184" fill="none" stroke="#48616d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M590 148 L825 148 L825 184" fill="none" stroke="#48616d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M590 148 L1060 148 L1060 184" fill="none" stroke="#48616d" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="20" y="184" width="200" height="218" rx="15" fill="#eef5f7" stroke="#76a4b1" stroke-width="2"/>
    <text x="120" y="220" text-anchor="middle" font-size="21" font-weight="700">One process</text>
    <text x="120" y="249" text-anchor="middle" font-size="17">resources → outcomes</text>
    <line x1="46" y1="270" x2="194" y2="270" stroke="#76a4b1"/>
    <text x="120" y="302" text-anchor="middle" font-size="17">radial / FDH</text>
    <text x="120" y="329" text-anchor="middle" font-size="17">SBM / additive</text>
    <text x="120" y="356" text-anchor="middle" font-size="17">directional</text>
    <text x="120" y="383" text-anchor="middle" font-size="17">cost / revenue / profit</text>
  </g>

  <g>
    <rect x="255" y="184" width="200" height="218" rx="15" fill="#f7f2e8" stroke="#c7a665" stroke-width="2"/>
    <text x="355" y="220" text-anchor="middle" font-size="21" font-weight="700">Bad outcomes</text>
    <text x="355" y="249" text-anchor="middle" font-size="17">production + burdens</text>
    <line x1="281" y1="270" x2="429" y2="270" stroke="#c7a665"/>
    <text x="355" y="302" text-anchor="middle" font-size="17">strong / weak disposal</text>
    <text x="355" y="329" text-anchor="middle" font-size="17">environmental DDF</text>
    <text x="355" y="356" text-anchor="middle" font-size="17">undesirable-output SBM</text>
    <text x="355" y="383" text-anchor="middle" font-size="17">by-production relation</text>
  </g>

  <g>
    <rect x="490" y="184" width="200" height="218" rx="15" fill="#eef3ea" stroke="#83a274" stroke-width="2"/>
    <text x="590" y="220" text-anchor="middle" font-size="21" font-weight="700">Internal network</text>
    <text x="590" y="249" text-anchor="middle" font-size="17">processes + deliveries</text>
    <line x1="516" y1="270" x2="664" y2="270" stroke="#83a274"/>
    <text x="590" y="302" text-anchor="middle" font-size="17">relational</text>
    <text x="590" y="329" text-anchor="middle" font-size="17">radial / additive</text>
    <text x="590" y="356" text-anchor="middle" font-size="17">network SBM</text>
    <text x="590" y="383" text-anchor="middle" font-size="17">open / connected systems</text>
  </g>

  <g>
    <rect x="725" y="184" width="200" height="218" rx="15" fill="#f2eef7" stroke="#9b82b4" stroke-width="2"/>
    <text x="825" y="220" text-anchor="middle" font-size="21" font-weight="700">State over time</text>
    <text x="825" y="249" text-anchor="middle" font-size="17">today → later capacity</text>
    <line x1="751" y1="270" x2="899" y2="270" stroke="#9b82b4"/>
    <text x="825" y="302" text-anchor="middle" font-size="17">carry-over technology</text>
    <text x="825" y="329" text-anchor="middle" font-size="17">radial / additive accounts</text>
    <text x="825" y="356" text-anchor="middle" font-size="17">dynamic SBM</text>
    <text x="825" y="383" text-anchor="middle" font-size="17">trajectory interpretation</text>
  </g>

  <g>
    <rect x="960" y="184" width="200" height="218" rx="15" fill="#f8eeee" stroke="#bc7a7a" stroke-width="2"/>
    <text x="1060" y="220" text-anchor="middle" font-size="21" font-weight="700">Change</text>
    <text x="1060" y="249" text-anchor="middle" font-size="17">performance + opportunity</text>
    <line x1="986" y1="270" x2="1134" y2="270" stroke="#bc7a7a"/>
    <text x="1060" y="302" text-anchor="middle" font-size="17">Malmquist / Luenberger</text>
    <text x="1060" y="329" text-anchor="middle" font-size="17">period / common reference</text>
    <text x="1060" y="356" text-anchor="middle" font-size="17">Hicks–Moorsteen</text>
    <text x="1060" y="383" text-anchor="middle" font-size="17">environmental productivity</text>
  </g>

  <text x="590" y="452" text-anchor="middle" font-size="20" font-weight="700">Every route still requires three visible cross-cutting decisions</text>
  <path d="M120 402 L120 475 L1060 475 L1060 402" fill="none" stroke="#a8b4ba" stroke-width="2"/>

  <rect x="80" y="505" width="310" height="122" rx="15" fill="#f4f7f8" stroke="#8799a2" stroke-width="2"/>
  <text x="235" y="542" text-anchor="middle" font-size="21" font-weight="700">Valuation and priorities</text>
  <text x="235" y="574" text-anchor="middle" font-size="17">prices, policy weights, restrictions,</text>
  <text x="235" y="600" text-anchor="middle" font-size="17">or no external valuation</text>

  <rect x="435" y="505" width="310" height="122" rx="15" fill="#f4f7f8" stroke="#8799a2" stroke-width="2"/>
  <text x="590" y="542" text-anchor="middle" font-size="21" font-weight="700">Evaluation protocol</text>
  <text x="590" y="574" text-anchor="middle" font-size="17">self, process, metafrontier,</text>
  <text x="590" y="600" text-anchor="middle" font-size="17">or intertemporal comparison</text>

  <rect x="790" y="505" width="310" height="122" rx="15" fill="#f4f7f8" stroke="#8799a2" stroke-width="2"/>
  <text x="945" y="542" text-anchor="middle" font-size="21" font-weight="700">Evidence and uncertainty</text>
  <text x="945" y="574" text-anchor="middle" font-size="17">deterministic description, sensitivity,</text>
  <text x="945" y="600" text-anchor="middle" font-size="17">robustness, or sampling inference</text>

  <text x="590" y="672" text-anchor="middle" font-size="18" fill="#48616d">Choose the smallest model that preserves the organization's real production and decision account.</text>
</g>
</svg>
