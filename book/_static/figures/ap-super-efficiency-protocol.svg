<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title description">
<title id="title">Ordinary self-appraisal and the historical leave-self-out idea</title>
<desc id="description">Ordinary radial DEA includes the evaluated branch in its own reference set. The verified historical Andersen--Petersen idea removes that observation before ranking efficient units. The programme details shown on the right come from a later development reconstruction that is deferred and not a current public recipe.</desc>
<defs>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#176b73"/>
  </marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#d97732"/>
  </marker>
</defs>
<rect width="1180" height="680" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#24323d">
  <text x="590" y="38" text-anchor="middle" font-size="26" font-weight="700">Can the remaining peers reproduce the leader’s record?</text>
  <text x="590" y="66" text-anchor="middle" font-size="16" fill="#53646e">Historical idea plus a later development reconstruction; no AP recipe is released in this edition.</text>

  <rect x="34" y="96" width="350" height="438" rx="17" fill="#f2f8f8" stroke="#176b73" stroke-width="2"/>
  <circle cx="70" cy="132" r="19" fill="#176b73"/>
  <text x="70" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">1</text>
  <text x="101" y="139" font-size="21" font-weight="700" fill="#176b73">Ordinary self-appraisal</text>
  <text x="209" y="171" text-anchor="middle" font-size="15" fill="#53646e">A belongs to the population used to evaluate A</text>

  <text x="64" y="213" font-size="14" font-weight="700" fill="#53646e">ELIGIBLE REFERENCE ROWS</text>
  <rect x="63" y="230" width="62" height="48" rx="9" fill="#176b73"/>
  <text x="94" y="260" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">A</text>
  <rect x="139" y="230" width="62" height="48" rx="9" fill="#ffffff" stroke="#9bbfc2" stroke-width="2"/>
  <text x="170" y="260" text-anchor="middle" font-size="19" font-weight="700">B</text>
  <rect x="215" y="230" width="62" height="48" rx="9" fill="#ffffff" stroke="#9bbfc2" stroke-width="2"/>
  <text x="246" y="260" text-anchor="middle" font-size="19" font-weight="700">C</text>
  <rect x="291" y="230" width="62" height="48" rx="9" fill="#ffffff" stroke="#9bbfc2" stroke-width="2"/>
  <text x="322" y="260" text-anchor="middle" font-size="19" font-weight="700">D</text>

  <rect x="63" y="313" width="118" height="66" rx="11" fill="#dceff0" stroke="#176b73"/>
  <text x="122" y="339" text-anchor="middle" font-size="16" font-weight="700">Observed A</text>
  <text x="122" y="362" text-anchor="middle" font-size="14">resources → services</text>
  <path d="M183 346 H229" stroke="#176b73" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="238" y="307" width="115" height="78" rx="11" fill="#ffffff" stroke="#9bbfc2" stroke-width="2"/>
  <text x="295" y="334" text-anchor="middle" font-size="15" font-weight="700">Technology</text>
  <text x="295" y="357" text-anchor="middle" font-size="14">includes A</text>
  <text x="295" y="376" text-anchor="middle" font-size="13" fill="#53646e">A can support itself</text>

  <path d="M208 395 V419" stroke="#176b73" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="77" y="430" width="264" height="67" rx="11" fill="#176b73"/>
  <text x="209" y="457" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Boundary score = 1</text>
  <text x="209" y="481" text-anchor="middle" font-size="14" fill="#ffffff">Frontier status, but no ranking among leaders</text>

  <rect x="414" y="96" width="350" height="438" rx="17" fill="#fff8f1" stroke="#d97732" stroke-width="2"/>
  <circle cx="450" cy="132" r="19" fill="#d97732"/>
  <text x="450" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">2</text>
  <text x="481" y="139" font-size="21" font-weight="700" fill="#b65c20">Leave-self-out idea</text>
  <text x="589" y="171" text-anchor="middle" font-size="15" fill="#53646e">A is evaluated, but its row cannot support the comparison</text>

  <text x="444" y="213" font-size="14" font-weight="700" fill="#53646e">PEER-ONLY REFERENCE ROWS</text>
  <rect x="443" y="230" width="62" height="48" rx="9" fill="#f3e1d2" stroke="#d97732" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="474" y="260" text-anchor="middle" font-size="19" font-weight="700" fill="#9a6541">A</text>
  <path d="M451 238 L497 270 M497 238 L451 270" stroke="#b65c20" stroke-width="3"/>
  <rect x="519" y="230" width="62" height="48" rx="9" fill="#ffffff" stroke="#d4b59c" stroke-width="2"/>
  <text x="550" y="260" text-anchor="middle" font-size="19" font-weight="700">B</text>
  <rect x="595" y="230" width="62" height="48" rx="9" fill="#ffffff" stroke="#d4b59c" stroke-width="2"/>
  <text x="626" y="260" text-anchor="middle" font-size="19" font-weight="700">C</text>
  <rect x="671" y="230" width="62" height="48" rx="9" fill="#ffffff" stroke="#d4b59c" stroke-width="2"/>
  <text x="702" y="260" text-anchor="middle" font-size="19" font-weight="700">D</text>

  <rect x="443" y="313" width="118" height="66" rx="11" fill="#f3e1d2" stroke="#d97732"/>
  <text x="502" y="339" text-anchor="middle" font-size="16" font-weight="700">Observed A</text>
  <text x="502" y="362" text-anchor="middle" font-size="14">held outside</text>
  <path d="M563 346 H609" stroke="#d97732" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <rect x="618" y="307" width="115" height="78" rx="11" fill="#ffffff" stroke="#d4b59c" stroke-width="2"/>
  <text x="675" y="334" text-anchor="middle" font-size="15" font-weight="700">Technology</text>
  <text x="675" y="357" text-anchor="middle" font-size="14">uses B, C, D</text>
  <text x="675" y="376" text-anchor="middle" font-size="13" fill="#53646e">same RTS and disposal</text>

  <path d="M588 395 V419" stroke="#d97732" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <rect x="457" y="430" width="264" height="67" rx="11" fill="#d97732"/>
  <text x="589" y="457" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Peer-replacement experiment</text>
  <text x="589" y="481" text-anchor="middle" font-size="14" fill="#ffffff">Can the rest of the system match A?</text>

  <rect x="794" y="96" width="352" height="438" rx="17" fill="#f6f7f8" stroke="#8799a2" stroke-width="2"/>
  <circle cx="830" cy="132" r="19" fill="#53646e"/>
  <text x="830" y="139" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">3</text>
  <text x="861" y="139" font-size="21" font-weight="700">Three possible answers</text>

  <rect x="824" y="183" width="292" height="88" rx="12" fill="#e9f4ed" stroke="#5b966f" stroke-width="2"/>
  <text x="848" y="213" font-size="19" font-weight="700" fill="#39704c">Score &gt; 1</text>
  <text x="848" y="238" font-size="15">A is radially distinctive relative to peers.</text>
  <text x="848" y="259" font-size="14" fill="#53646e">Report a margin—not “more than 100% efficient.”</text>

  <rect x="824" y="288" width="292" height="88" rx="12" fill="#edf3f5" stroke="#76a4b1" stroke-width="2"/>
  <text x="848" y="318" font-size="19" font-weight="700" fill="#176b73">Score ≤ 1</text>
  <text x="848" y="343" font-size="15">The peer-only activity can match or beat A.</text>
  <text x="848" y="364" font-size="14" fill="#53646e">Ordinary inefficiency remains visible.</text>

  <rect x="824" y="393" width="292" height="111" rx="12" fill="#fff1e6" stroke="#d97732" stroke-width="2"/>
  <text x="848" y="423" font-size="19" font-weight="700" fill="#b65c20">Infeasible</text>
  <text x="848" y="448" font-size="15">Peers cannot form the required comparison</text>
  <text x="848" y="469" font-size="15">under the declared RTS and orientation.</text>
  <text x="848" y="491" font-size="14" fill="#53646e">Keep the status; do not repair silently.</text>

  <path d="M384 315 H406" stroke="#8799a2" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <path d="M764 315 H786" stroke="#8799a2" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <rect x="74" y="566" width="1032" height="81" rx="14" fill="#173f4f"/>
  <text x="590" y="598" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">The defining source must qualify the complete appraisal contract.</text>
  <text x="590" y="624" text-anchor="middle" font-size="16" fill="#ffffff">The displayed score branches are later reconstruction concepts—not a current Andersen–Petersen API.</text>
</g>
</svg>
