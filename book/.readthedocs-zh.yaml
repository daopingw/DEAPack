version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install --disable-pip-version-check --no-deps pip==25.0.1 setuptools==84.0.0
      - python -m pip install --disable-pip-version-check --constraint constraints/release-python312.txt --no-build-isolation --requirement book/requirements.txt
    post_install:
      - python scripts/release_toolchain.py verify-installed --profile docs --require-ci-platform
    pre_build:
      - sphinx-build -E -a -W --keep-going -b gettext book book/_build/gettext
      - python scripts/localize_handbook_math_labels.py --check
      - python scripts/check_handbook_translations.py --require-complete --template-root book/_build/gettext
      - make -C book figures PYTHON=python

sphinx:
  configuration: book/conf_zh.py
  fail_on_warning: true
